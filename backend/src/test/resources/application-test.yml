spring:
  test:
    database:
      replace: none
  datasource:
    driver-class-name: org.postgresql.Driver
    username: lms
    password: lms
    hikari:
      maximum-pool-size: 5
      minimum-idle: 0
      max-lifetime: 60000
  flyway:
    placeholders:
      tenant_app_role: ${APP_TENANT_DATASOURCE_USERNAME:lms_tenant_app}
      # The V41 migration provisions the lms_tenant_app role with this password on the first
      # context that migrates the shared container; app.datasource.tenant.password below must
      # resolve from the same APP_TENANT_DATASOURCE_PASSWORD source so the two can never
      # diverge. The default is deliberately non-legacy: test-data contexts are NOT
      # dev-exempt, so UnsafeDeploymentConfigurationValidator and
      # TenantDatasourceSecurityValidator reject lms_tenant_app_password.
      tenant_app_password: ${APP_TENANT_DATASOURCE_PASSWORD:test-tenant-rotated-password}
    enabled: true
  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

lms:
  it:
    ephemeral-database: true

app:
  security:
    bootstrap-user:
      username: test.admin
      email: test.admin@bhawana.local
      password: TestPassword123!
      roles:
        - SYSTEM_ADMIN
    jwt:
      secret: change-me-test-secret-change-me-test-secret
      secure-cookies: false
    refresh-token-retention:
      # Scheduled purge off; RefreshTokenRetentionWorkerTest calls the purge directly.
      enabled: false
  seed:
    sample-data:
      enabled: false
  reports:
    processing:
      enabled: false
    notifications:
      enabled: false
  rate-limit:
    enabled: false
  disbursement:
    worker:
      enabled: false
    intent-workflow:
      # Durable intent is the only path; test profile uses the same path as production.
      lease-duration-seconds: 120
      claim-batch-size: 10
      lease-owner: disbursement-worker
    mock:
      imps-max-amount: 500000
      status-check:
        min-polls: 1
        max-polls: 2
  schedule:
    validation:
      first-due-min-days: 1
      first-due-max-days: 60
      cadence-tolerance-days: 7
      horizon-grace-days: 75
      interest-row-tolerance-abs: 10.00
      interest-row-tolerance-pct: 0.02
      interest-total-tolerance-abs: 100.00
      interest-total-tolerance-pct: 0.01
  borrower:
    bank-details:
      velocity-max-updates: 2
      velocity-window-days: 7
      mismatch-max-attempts: 3
      mismatch-window-minutes: 15
  alert-rules:
    scheduler-enabled: false
    # Effectively off by default. This rule reads live pg_stat_activity, so unlike every other
    # alert rule its outcome depends on ambient state of the shared test cluster rather than on
    # the calling test's own fixtures — a stray transaction open past the production 300s default
    # would add an alert to EvaluationSummary.alertsEmitted() and break the unrelated
    # assertThat(...alertsEmitted()).isZero() assertions in the DPD transition tests.
    # AlertRuleEvaluationWorkerOldestTransactionAgeIntegrationTest sets the threshold it needs
    # explicitly per phase, so it is unaffected by this.
    oldest-transaction-age-seconds: 86400
  portfolio-kpi:
    scheduler-enabled: false
    # Scheduled purge off; retention tests drive the worker method explicitly.
    purge-enabled: false
  idempotency:
    purge-enabled: false
  loan-event-log:
    # Off by default so a background run cannot create or drop partitions underneath a test that is
    # asserting on them. LoanEventPartitionLifecyclePostgresTest drives maintenance explicitly.
    partition-maintenance-enabled: false
  storage:
    documents:
      provider: LOCAL
      root-path: ${java.io.tmpdir}/lms-documents-test
      r2:
        endpoint:
        access-key:
        secret-key:
        bucket:
        region: auto
      orphan-reconciler:
        enabled: false
  datasource:
    tenant:
      username: ${APP_TENANT_DATASOURCE_USERNAME:lms_tenant_app}
      # Must resolve to the same value as spring.flyway.placeholders.tenant_app_password
      # above: the Flyway-provisioned role password is what these credentials authenticate
      # against, and TenantDatasourceSecurityValidator probes a live connection with them.
      password: ${APP_TENANT_DATASOURCE_PASSWORD:test-tenant-rotated-password}
      connection-strategy: ${APP_TENANT_CONNECTION_STRATEGY:DIRECT_LOGIN}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
