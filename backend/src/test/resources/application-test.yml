spring:
  datasource:
    url: jdbc:h2:mem:lms;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    placeholders:
      tenant_app_role: ${APP_TENANT_DATASOURCE_USERNAME:lms_tenant_app}
      tenant_app_password: ${APP_TENANT_DATASOURCE_PASSWORD:lms_tenant_app_password}
    enabled: false
  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

app:
  security:
    bootstrap-user:
      username: test.admin
      email: test.admin@bhawana.local
      password: TestPassword123!
      roles:
        - SYSTEM_ADMIN
    jwt:
      secret: change-me-test-secret-change-me-test-secret
      secure-cookies: false
  seed:
    sample-data:
      enabled: false
  webhooks:
    delivery:
      enabled: false
  reports:
    processing:
      enabled: false
    notifications:
      enabled: false
  rate-limit:
    enabled: false
  disbursement:
    worker:
      enabled: false
    mock:
      imps-max-amount: 500000
      status-check:
        min-polls: 1
        max-polls: 2
  borrower:
    bank-details:
      velocity-max-updates: 2
      velocity-window-days: 7
      mismatch-max-attempts: 3
      mismatch-window-minutes: 15
  alert-rules:
    scheduler-enabled: false
  storage:
    documents:
      provider: LOCAL
      root-path: ${java.io.tmpdir}/lms-documents-test
      r2:
        endpoint:
        access-key:
        secret-key:
        bucket:
        region: auto
  datasource:
    tenant:
      username: ${APP_TENANT_DATASOURCE_USERNAME:lms_tenant_app}
      password: ${APP_TENANT_DATASOURCE_PASSWORD:lms_tenant_app_password}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
