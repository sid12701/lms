spring:
  datasource:
    url: ${LMS_DB_URL:jdbc:postgresql://db.avvzobksoybnmwjkeelk.supabase.co:5432/postgres?sslmode=require}
    username: ${LMS_DB_USERNAME:postgres}
    password: ${LMS_DB_PASSWORD:5hjJa0oRsZOWyGik}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 300000
      max-lifetime: 600000
      keepalive-time: 60000
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: ${LMS_REDIS_HOST:localhost}
      port: ${LMS_REDIS_PORT:6379}
  rabbitmq:
    host: ${LMS_RABBITMQ_HOST:localhost}
    port: ${LMS_RABBITMQ_PORT:5672}
    username: ${LMS_RABBITMQ_USERNAME:lms}
    password: ${LMS_RABBITMQ_PASSWORD:lms}
  mail:
    host: ${LMS_MAIL_HOST:localhost}
    port: ${LMS_MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

app:
  security:
    bootstrap-user:
      username: ${APP_SECURITY_BOOTSTRAP_USERNAME:ops.admin}
      password: ${APP_SECURITY_BOOTSTRAP_PASSWORD:ChangeMe123!}
      roles:
        - SYSTEM_ADMIN
        - OPS_USER
    jwt:
      secret: ${APP_SECURITY_JWT_SECRET:change-me-local-dev-secret-change-me-local-dev}
      secure-cookies: false
  seed:
    sample-data:
      enabled: false
    demo-portfolio:
      enabled: false
  storage:
    documents:
      provider: ${APP_STORAGE_DOCUMENTS_PROVIDER:R2}
      root-path: ${APP_STORAGE_DOCUMENTS_ROOT_PATH:${java.io.tmpdir}/lms-documents-local}
      r2:
        endpoint: ${APP_STORAGE_DOCUMENTS_R2_ENDPOINT:}
        access-key: ${APP_STORAGE_DOCUMENTS_R2_ACCESS_KEY:}
        secret-key: ${APP_STORAGE_DOCUMENTS_R2_SECRET_KEY:}
        bucket: ${APP_STORAGE_DOCUMENTS_R2_BUCKET:}
        region: ${APP_STORAGE_DOCUMENTS_R2_REGION:auto}
    reports:
      r2:
        endpoint: ${APP_STORAGE_REPORTS_R2_ENDPOINT:}
        access-key: ${APP_STORAGE_REPORTS_R2_ACCESS_KEY:}
        secret-key: ${APP_STORAGE_REPORTS_R2_SECRET_KEY:}
        bucket: ${APP_STORAGE_REPORTS_R2_BUCKET:}
        region: ${APP_STORAGE_REPORTS_R2_REGION:auto}
  datasource:
    tenant:
      username: ${APP_TENANT_DATASOURCE_USERNAME:lms_tenant_app}
      password: ${APP_TENANT_DATASOURCE_PASSWORD:lms_tenant_app_password}
