spring:
  application:
    name: lms-backend
  profiles:
    default: local
  jackson:
    serialization:
      write-dates-as-timestamps: false
  jpa:
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  security:
    bootstrap-user:
      username: ${APP_SECURITY_BOOTSTRAP_USERNAME:ops.admin}
      password: ${APP_SECURITY_BOOTSTRAP_PASSWORD:ChangeMe123!}
      roles:
        - SYSTEM_ADMIN
        - OPS_USER
    jwt:
      secret: ${APP_SECURITY_JWT_SECRET:}
      issuer: ${APP_SECURITY_JWT_ISSUER:bhawana-lms}
      ttl: ${APP_SECURITY_JWT_TTL:PT30M}
  seed:
    sample-data:
      enabled: false
  webhooks:
    delivery:
      enabled: true
      fixed-delay-ms: 60000
      batch-size: 20
  reports:
    processing:
      enabled: true
      fixed-delay-ms: 15000
      batch-size: 10
