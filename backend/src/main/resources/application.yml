server:
  # NONE disables implicit container forwarding (Tomcat's NATIVE strategy rewrote
  # getRemoteAddr() from X-Forwarded-For before application code ran, making even
  # "use getRemoteAddr()" spoofable). The raw socket peer is the trust anchor; configured
  # trusted proxies are evaluated explicitly in ClientIpResolutionFilter over a strict
  # single-XFF contract (docs/edge-proxy-contract.md): the edge MUST strip any
  # client-supplied X-Forwarded-For/X-Real-IP/Forwarded and set exactly one X-Forwarded-For
  # line of bare IP literals. Malformed/ambiguous trusted input is rejected with 400.
  forward-headers-strategy: NONE
  tomcat:
    # JSON bodies above this limit are rejected with 413 before controller dispatch.
    max-http-post-size: 10MB

spring:
  application:
    name: lms-backend
  # No implicit default profile. Booting without an explicitly active profile enforces
  # production safety checks (UnsafeDeploymentConfigurationValidator + TenantDatasourceSecurityValidator
  # + DisbursementSimulationGuard all fail closed on unset profiles). Local development must
  # activate the local profile explicitly (see backend/README.md).
  servlet:
    multipart:
      # Above DocumentUploadPolicy's 10MB cap so oversized files reach the
      # policy and fail with 422 DOCUMENT_FILE_TOO_LARGE; anything beyond
      # these limits gets 413 from MaxUploadSizeExceededException.
      max-file-size: 12MB
      max-request-size: 40MB
  flyway:
    placeholders:
      tenant_app_role: ${APP_TENANT_DATASOURCE_USERNAME:lms_tenant_app}
      tenant_app_password: ${APP_TENANT_DATASOURCE_PASSWORD}
  jackson:
    serialization:
      write-dates-as-timestamps: false
  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      # M10: this is the ONLY Redis configuration the rate limiter reads — credentials, TLS,
      # and timeouts flow into the shared Lettuce client the limiter borrows. There is no
      # second hand-rolled client.
      host: ${LMS_REDIS_HOST:localhost}
      port: ${LMS_REDIS_PORT:6379}
      username: ${LMS_REDIS_USERNAME:}
      password: ${LMS_REDIS_PASSWORD:}
      database: ${LMS_REDIS_DATABASE:0}
      # Command timeout is the rate limiter's per-request store deadline. Bucket4j CAS does a
      # couple of EVALSHA round-trips; measured p99 on a same-region Redis is single-digit ms,
      # so 200ms is a generous bound that still fails a stalled store before the caller's own
      # HTTP budget is burned. Raise only with measured latency evidence.
      timeout: ${LMS_REDIS_COMMAND_TIMEOUT:200ms}
      # TCP connect deadline — bounds the lazy reconnect attempt during an outage.
      connect-timeout: ${LMS_REDIS_CONNECT_TIMEOUT:2s}
      ssl:
        # Set true for Azure Cache for Redis and other TLS-terminated endpoints. For a
        # self-signed/private CA also set spring.ssl.bundle + spring.data.redis.ssl.bundle.
        enabled: ${LMS_REDIS_SSL_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        # Prometheus exposition for the deployment-selected collector
        # (docs/architecture/deployment-strategy.md). Scraping is authenticated;
        # see SecurityFilterChainConfig — SYSTEM_ADMIN only.
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        default:
          include: livenessState, readinessState
        readiness:
          include: readinessState, db
        liveness:
          include: livenessState

springdoc:
  # Machine-readable contract at /v3/api-docs (auth required — see
  # SecurityFilterChainConfig). Swagger UI stays off outside local dev.
  api-docs:
    enabled: true
  swagger-ui:
    enabled: false
    path: /swagger-ui.html

app:
  edge:
    # Explicit trusted proxy ranges, literal IP/CIDR only (hostnames rejected at
    # startup; no DNS). Empty = never trust forwarding input; the socket peer is always
    # the client IP. No implicit private-range trust.
    # Env: comma-separated CIDRs, e.g. "10.0.0.0/24,2001:db8::/32".
    trusted-proxies: ${APP_EDGE_TRUSTED_PROXIES:}
    # Bound on accepted XFF hops; overlong trusted chains are rejected with 400.
    max-forwarded-hops: ${APP_EDGE_MAX_FORWARDED_HOPS:8}
  security:
    bootstrap-user:
      # No default identities. Every profile must configure these explicitly
      # (application-local.yml carries the explicit local example; all other deployments set
      # APP_SECURITY_BOOTSTRAP_* via the secret store). Missing values fail closed at bind time
      # and in UnsafeDeploymentConfigurationValidator.
      username: ${APP_SECURITY_BOOTSTRAP_USERNAME:}
      email: ${APP_SECURITY_BOOTSTRAP_EMAIL:}
      password: ${APP_SECURITY_BOOTSTRAP_PASSWORD:}
      roles:
        - SYSTEM_ADMIN
        - OPS_USER
    jwt:
      secret: ${APP_SECURITY_JWT_SECRET:}
      issuer: ${APP_SECURITY_JWT_ISSUER:bhawana-lms}
      # Distinct audiences for locally minted human vs machine tokens. Tokens minted
      # before audiences existed (missing aud) are rejected with no compatibility window;
      # rotating the secret or audience forces reauthentication (see JwtSecurityBeans).
      human-audience: ${APP_SECURITY_JWT_HUMAN_AUDIENCE:bhawana-lms-human}
      machine-audience: ${APP_SECURITY_JWT_MACHINE_AUDIENCE:bhawana-lms-machine}
      ttl: ${APP_SECURITY_JWT_TTL:PT30M}
      refresh-ttl: ${APP_SECURITY_JWT_REFRESH_TTL:P7D}
      secure-cookies: ${APP_SECURITY_JWT_SECURE_COOKIES:true}
    cors:
      # Credentialed cross-origin allowlist for the separately hosted SPA. No default:
      # empty means NO browser origin may call the API cross-origin (fail closed), which is
      # correct for API-only deployments and for a deployment that forgot to configure one.
      # Local dev-server origins live only in application-local.yml; real deployments set
      # APP_SECURITY_CORS_ALLOWED_ORIGINS as a comma-separated list of explicit origins.
      # Wildcards are rejected at startup — credentials require explicit origins.
      # Deployment contract: docs/spa-deployment-contract.md.
      allowed-origins: ${APP_SECURITY_CORS_ALLOWED_ORIGINS:}
    # Entra v2 app-only machine identity (disabled by default). When enabled, configure
    # real tenant/API/client IDs, JWKS URI, required app role and explicit mappings to enabled
    # local api_client rows. Local client-credentials (/auth/token) remain until partner cutover.
    entra-machine-identity:
      enabled: ${APP_SECURITY_ENTRA_MACHINE_ENABLED:false}
      trusted-tenant-id: ${APP_SECURITY_ENTRA_TRUSTED_TENANT_ID:}
      issuer: ${APP_SECURITY_ENTRA_ISSUER:}
      api-audience: ${APP_SECURITY_ENTRA_API_AUDIENCE:}
      jwks-uri: ${APP_SECURITY_ENTRA_JWKS_URI:}
      required-app-role: ${APP_SECURITY_ENTRA_REQUIRED_APP_ROLE:}
      connect-timeout: ${APP_SECURITY_ENTRA_JWKS_CONNECT_TIMEOUT:PT2S}
      read-timeout: ${APP_SECURITY_ENTRA_JWKS_READ_TIMEOUT:PT2S}
      jwks-cache-ttl: ${APP_SECURITY_ENTRA_JWKS_CACHE_TTL:PT10M}
      unknown-kid-min-interval: ${APP_SECURITY_ENTRA_UNKNOWN_KID_MIN_INTERVAL:PT30S}
      mappings: []
  seed:
    sample-data:
      enabled: false
    synthetic-portfolio:
      # The seed service bean only exists under the local/staging/test-data profiles.
      # Even there it fails closed unless enabled=true AND the connected database name
      # appears in allowed-database-names (empty by default — never seed a database
      # that was not explicitly listed).
      enabled: false
      allowed-database-names: []
      scale-factor: 1.0
      lsp-count: 10
      whale-lsp-index: 0
      whale-volume-share: 0.25
      batch-size: 5000
      tenure-months: 12
  reports:
    processing:
      enabled: true
      fixed-delay-ms: 15000
      batch-size: 10
    notifications:
      enabled: true
      from-address: ${APP_REPORTS_NOTIFICATIONS_FROM_ADDRESS:no-reply@bhawanalms.local}
      reports-page-url: ${APP_REPORTS_NOTIFICATIONS_REPORTS_PAGE_URL:http://127.0.0.1:5173/reports}
  storage:
    documents:
      provider: ${APP_STORAGE_DOCUMENTS_PROVIDER:R2}
      root-path: ${APP_STORAGE_DOCUMENTS_ROOT_PATH:${java.io.tmpdir}/lms-documents}
      r2:
        endpoint: ${APP_STORAGE_DOCUMENTS_R2_ENDPOINT:}
        access-key: ${APP_STORAGE_DOCUMENTS_R2_ACCESS_KEY:}
        secret-key: ${APP_STORAGE_DOCUMENTS_R2_SECRET_KEY:}
        bucket: ${APP_STORAGE_DOCUMENTS_R2_BUCKET:}
        region: ${APP_STORAGE_DOCUMENTS_R2_REGION:auto}
        # M05 request-time budget on the shared client. Documents are capped at 10MB, so 30s
        # per attempt / 120s per call is generous; the 5s connect and 30s socket deadlines are
        # what actually fire on an unreachable or stalled endpoint.
        api-call-timeout: ${APP_STORAGE_DOCUMENTS_R2_API_CALL_TIMEOUT:PT120S}
        api-call-attempt-timeout: ${APP_STORAGE_DOCUMENTS_R2_API_CALL_ATTEMPT_TIMEOUT:PT30S}
        connection-timeout: ${APP_STORAGE_DOCUMENTS_R2_CONNECTION_TIMEOUT:PT5S}
        socket-timeout: ${APP_STORAGE_DOCUMENTS_R2_SOCKET_TIMEOUT:PT30S}
        max-connections: ${APP_STORAGE_DOCUMENTS_R2_MAX_CONNECTIONS:50}
      orphan-reconciler:
        enabled: ${APP_STORAGE_DOCUMENTS_ORPHAN_RECONCILER_ENABLED:true}
        dry-run: ${APP_STORAGE_DOCUMENTS_ORPHAN_RECONCILER_DRY_RUN:true}
        grace-period: ${APP_STORAGE_DOCUMENTS_ORPHAN_RECONCILER_GRACE_PERIOD:PT24H}
        batch-size: ${APP_STORAGE_DOCUMENTS_ORPHAN_RECONCILER_BATCH_SIZE:100}
    reports:
      r2:
        endpoint: ${APP_STORAGE_REPORTS_R2_ENDPOINT:}
        access-key: ${APP_STORAGE_REPORTS_R2_ACCESS_KEY:}
        secret-key: ${APP_STORAGE_REPORTS_R2_SECRET_KEY:}
        bucket: ${APP_STORAGE_REPORTS_R2_BUCKET:}
        region: ${APP_STORAGE_REPORTS_R2_REGION:auto}
        # M05: same deadline/pool contract as document storage; report exports are larger, so
        # the total call budget is the knob to raise first if uploads legitimately outgrow it.
        api-call-timeout: ${APP_STORAGE_REPORTS_R2_API_CALL_TIMEOUT:PT120S}
        api-call-attempt-timeout: ${APP_STORAGE_REPORTS_R2_API_CALL_ATTEMPT_TIMEOUT:PT30S}
        connection-timeout: ${APP_STORAGE_REPORTS_R2_CONNECTION_TIMEOUT:PT5S}
        socket-timeout: ${APP_STORAGE_REPORTS_R2_SOCKET_TIMEOUT:PT30S}
        max-connections: ${APP_STORAGE_REPORTS_R2_MAX_CONNECTIONS:50}
  datasource:
    tenant:
      username: ${APP_TENANT_DATASOURCE_USERNAME:lms_tenant_app}
      password: ${APP_TENANT_DATASOURCE_PASSWORD}
      connection-strategy: ${APP_TENANT_CONNECTION_STRATEGY:DIRECT_LOGIN}
  rate-limit:
    enabled: ${APP_RATE_LIMIT_ENABLED:true}
    # M10 outage policy. If the rate-limit store is unreachable or a command exceeds
    # spring.data.redis.timeout, every matched route applies its on-store-failure policy:
    # FAIL_CLOSED answers a bounded 503 + Retry-After (unavailable-retry-after-seconds) and is
    # required on credential-attack-sensitive routes; FAIL_OPEN counts the failure and lets
    # the request through for authenticated non-credential routes. reconnect-interval is the
    # cooldown between Redis re-dial attempts after a connect failure; recovery is automatic
    # and needs no instance restart.
    reconnect-interval: ${APP_RATE_LIMIT_RECONNECT_INTERVAL:PT5S}
    unavailable-retry-after-seconds: ${APP_RATE_LIMIT_UNAVAILABLE_RETRY_AFTER_SECONDS:30}
    rules:
      - id: auth-login
        path: /api/v1/auth/login
        methods: [POST]
        key: IP
        permits-per-minute: ${APP_RATE_LIMIT_AUTH_PER_MINUTE:10}
        # Credential endpoint: never accept unlimited attempts while the limiter is blind.
        on-store-failure: FAIL_CLOSED
      - id: auth-token
        path: /api/v1/auth/token
        methods: [POST]
        key: IP
        permits-per-minute: ${APP_RATE_LIMIT_AUTH_PER_MINUTE:10}
        on-store-failure: FAIL_CLOSED
      - id: lsp-write
        path: /api/v1/lsp/**
        methods: [POST, PUT, PATCH, DELETE]
        key: LSP
        permits-per-minute: ${APP_RATE_LIMIT_LSP_WRITE_PER_MINUTE:60}
        # Already behind a machine token + LSP role; availability wins over the limiter.
        on-store-failure: FAIL_OPEN
      - id: auth-refresh
        path: /api/v1/auth/refresh
        methods: [POST]
        key: IP_AND_SUBJECT
        permits-per-minute: 30
        # Refresh tokens are bearer credentials — same fail-closed class as login.
        on-store-failure: FAIL_CLOSED
      - id: auth-password
        path: /api/v1/auth/password
        methods: [POST]
        key: SUBJECT
        permits-per-minute: 5
        on-store-failure: FAIL_CLOSED
      - id: admin-reset-password
        path: /api/v1/internal/admin/users/*/reset-password
        methods: [POST]
        key: SUBJECT
        permits-per-minute: 5
        on-store-failure: FAIL_OPEN
      - id: admin-revoke-sessions
        path: /api/v1/internal/admin/users/*/revoke-sessions
        methods: [POST]
        key: SUBJECT
        permits-per-minute: 5
        on-store-failure: FAIL_OPEN
      - id: docs-ops
        path: /api/v1/internal/ops/loan-applications/*/kyc-documents/**
        methods: [GET]
        key: SUBJECT
        permits-per-minute: 120
        on-store-failure: FAIL_OPEN
      - id: docs-lsp
        path: /api/v1/lsp/loan-applications/*/documents/**
        methods: [GET]
        key: LSP
        permits-per-minute: 120
        on-store-failure: FAIL_OPEN
      - id: lsp-loan-events
        path: /api/v1/lsp/loan-events
        methods: [GET]
        key: LSP
        permits-per-minute: ${APP_RATE_LIMIT_LSP_FEED_PER_MINUTE:120}
        on-store-failure: FAIL_OPEN
      - id: reports
        path: /api/v1/internal/reports/**
        methods: [GET, POST]
        key: SUBJECT
        permits-per-minute: 60
        on-store-failure: FAIL_OPEN
      - id: mock-outcome
        path: /api/v1/internal/ops/loan-applications/*/disbursement-requests/mock-outcome
        methods: [POST]
        key: SUBJECT_AND_APPLICATION
        permits-subject: 10
        permits-application: 5
        on-store-failure: FAIL_OPEN
  disbursement:
    worker:
      enabled: ${APP_DISBURSEMENT_WORKER_ENABLED:true}
      fixed-delay-ms: ${APP_DISBURSEMENT_WORKER_FIXED_DELAY_MS:30000}
      status-check-delay-ms: ${APP_DISBURSEMENT_WORKER_STATUS_CHECK_DELAY_MS:60000}
      reconciliation-delay-ms: ${APP_DISBURSEMENT_WORKER_RECONCILIATION_DELAY_MS:60000}
      max-attempts: ${APP_DISBURSEMENT_WORKER_MAX_ATTEMPTS:5}
      auto-resolve-mock-outcome: ${APP_DISBURSEMENT_WORKER_AUTO_RESOLVE_MOCK:true}
      scan-batch-size: ${APP_DISBURSEMENT_WORKER_SCAN_BATCH_SIZE:200}
    intent-workflow:
      # Durable intent is the only disbursement initiation path (no enable/disable flag).
      lease-duration-seconds: ${APP_DISBURSEMENT_INTENT_LEASE_SECONDS:120}
      claim-batch-size: ${APP_DISBURSEMENT_INTENT_CLAIM_BATCH_SIZE:10}
      lease-owner: ${APP_DISBURSEMENT_INTENT_LEASE_OWNER:disbursement-worker}
    mock:
      imps-max-amount: ${APP_DISBURSEMENT_MOCK_IMPS_MAX_AMOUNT:500000}
      status-check:
        min-polls: ${APP_DISBURSEMENT_MOCK_STATUS_CHECK_MIN_POLLS:1}
        max-polls: ${APP_DISBURSEMENT_MOCK_STATUS_CHECK_MAX_POLLS:6}
  schedule:
    validation:
      # Spec S20 — accepted product defaults (2026-07-15). Date + interest checks always on.
      first-due-min-days: ${APP_SCHEDULE_VALIDATION_FIRST_DUE_MIN_DAYS:1}
      first-due-max-days: ${APP_SCHEDULE_VALIDATION_FIRST_DUE_MAX_DAYS:60}
      cadence-tolerance-days: ${APP_SCHEDULE_VALIDATION_CADENCE_TOLERANCE_DAYS:7}
      horizon-grace-days: ${APP_SCHEDULE_VALIDATION_HORIZON_GRACE_DAYS:75}
      interest-row-tolerance-abs: ${APP_SCHEDULE_VALIDATION_INTEREST_ROW_TOLERANCE_ABS:10.00}
      interest-row-tolerance-pct: ${APP_SCHEDULE_VALIDATION_INTEREST_ROW_TOLERANCE_PCT:0.02}
      interest-total-tolerance-abs: ${APP_SCHEDULE_VALIDATION_INTEREST_TOTAL_TOLERANCE_ABS:100.00}
      interest-total-tolerance-pct: ${APP_SCHEDULE_VALIDATION_INTEREST_TOTAL_TOLERANCE_PCT:0.01}
  borrower:
    bank-details:
      velocity-max-updates: ${APP_BORROWER_BANK_DETAILS_VELOCITY_MAX_UPDATES:3}
      velocity-window-days: ${APP_BORROWER_BANK_DETAILS_VELOCITY_WINDOW_DAYS:7}
      mismatch-max-attempts: ${APP_BORROWER_BANK_DETAILS_MISMATCH_MAX_ATTEMPTS:3}
      mismatch-window-minutes: ${APP_BORROWER_BANK_DETAILS_MISMATCH_WINDOW_MINUTES:15}
  alert-rules:
    scheduler-enabled: ${APP_ALERT_RULES_SCHEDULER_ENABLED:true}
    scheduler-fixed-delay-ms: ${APP_ALERT_RULES_SCHEDULER_FIXED_DELAY_MS:300000}
    stale-intake-hours: ${APP_ALERT_RULES_STALE_INTAKE_HOURS:24}
    stuck-disbursement-hours: ${APP_ALERT_RULES_STUCK_DISBURSEMENT_HOURS:2}
    lsp-reject-window-days: ${APP_ALERT_RULES_LSP_REJECT_WINDOW_DAYS:7}
    lsp-reject-min-samples: ${APP_ALERT_RULES_LSP_REJECT_MIN_SAMPLES:10}
    lsp-reject-rate-pct: ${APP_ALERT_RULES_LSP_REJECT_RATE_PCT:40}
    auth-brute-force-threshold: ${APP_ALERT_RULES_AUTH_BRUTE_FORCE_THRESHOLD:5}
    auth-brute-force-window-minutes: ${APP_ALERT_RULES_AUTH_BRUTE_FORCE_WINDOW_MINUTES:10}
    auth-brute-force-distributed-threshold: ${APP_ALERT_RULES_AUTH_BRUTE_FORCE_DISTRIBUTED_THRESHOLD:20}
    auth-brute-force-distributed-distinct-ip-min: ${APP_ALERT_RULES_AUTH_BRUTE_FORCE_DISTRIBUTED_DISTINCT_IP_MIN:5}
    auth-brute-force-distributed-window-hours: ${APP_ALERT_RULES_AUTH_BRUTE_FORCE_DISTRIBUTED_WINDOW_HOURS:24}
    evaluation-batch-limit: ${APP_ALERT_RULES_EVALUATION_BATCH_LIMIT:500}
    evaluation-lease-ms: ${APP_ALERT_RULES_EVALUATION_LEASE_MS:300000}
    evaluation-statement-timeout-ms: ${APP_ALERT_RULES_EVALUATION_STATEMENT_TIMEOUT_MS:60000}
  idempotency:
    retention-days: ${APP_IDEMPOTENCY_RETENTION_DAYS:90}
    purge-enabled: ${APP_IDEMPOTENCY_PURGE_ENABLED:true}
    purge-fixed-delay-ms: ${APP_IDEMPOTENCY_PURGE_FIXED_DELAY_MS:3600000}
    lease-duration-seconds: ${APP_IDEMPOTENCY_LEASE_DURATION_SECONDS:60}
    lease-owner: ${APP_IDEMPOTENCY_LEASE_OWNER:${HOSTNAME:lms-api}}
    # 0 = duplicates get 409 IDEMPOTENCY_IN_PROGRESS + Retry-After immediately
    # (a final re-check still replays a just-completed record) instead of holding
    # the request thread open while polling.
    completion-wait-seconds: ${APP_IDEMPOTENCY_COMPLETION_WAIT_SECONDS:0}
    # Cap on the Retry-After hint for in-progress duplicates; without it the hint
    # could span the whole remaining lease duration.
    retry-after-cap-seconds: ${APP_IDEMPOTENCY_RETRY_AFTER_CAP_SECONDS:5}
  portfolio-kpi:
    scheduler-enabled: ${APP_PORTFOLIO_KPI_SCHEDULER_ENABLED:true}
    scheduler-fixed-delay-ms: ${APP_PORTFOLIO_KPI_SCHEDULER_FIXED_DELAY_MS:900000}
    advisory-lock-id: ${APP_PORTFOLIO_KPI_ADVISORY_LOCK_ID:42109}
  loan-event-log:
    # Retention floor published to partners (ADR 0007). Partitions are whole months, so the month
    # holding the cutoff is kept until everything in it has aged out.
    retention-days: ${APP_LOAN_EVENT_LOG_RETENTION_DAYS:30}
    partition-maintenance-enabled: ${APP_LOAN_EVENT_LOG_PARTITION_MAINTENANCE_ENABLED:true}
    partition-maintenance-fixed-delay-ms: ${APP_LOAN_EVENT_LOG_PARTITION_MAINTENANCE_FIXED_DELAY_MS:3600000}
    partition-lead-months: ${APP_LOAN_EVENT_LOG_PARTITION_LEAD_MONTHS:3}
