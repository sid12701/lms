name: Journey E2E

# Finding M17, raised 2026-09-06, asked for backend-connected lending journeys in CI. It was
# deferred because the stack was not wired, and frontend-ci.yml still carries the comment saying
# so. The specs already existed but were only being run on a developer machine.
#
# SOAKING — NON-BLOCKING. This job reports but does not fail the build while its cold-start path
# accumulates reliability evidence. The former durable-intent seeder race and bootstrap-password
# setup mismatch now have explicit synchronization below and in globalSetup.
#
# Promote to blocking by deleting the continue-on-error line below, once a cold start seeds
# cleanly and the suite has been green for a couple of weeks.

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: journey-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lending-journey:
    name: Backend-connected lending journey (soaking, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: lms
          POSTGRES_USER: lms
          POSTGRES_PASSWORD: lms
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lms -d lms"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10
      mailhog:
        image: mailhog/mailhog:v1.0.1
        ports: ["1025:1025", "8025:8025"]

    env:
      SPRING_PROFILES_ACTIVE: local
      LMS_DB_URL: jdbc:postgresql://localhost:5432/lms
      LMS_DB_USERNAME: lms
      LMS_DB_PASSWORD: lms
      LMS_REDIS_PORT: "6379"
      LMS_MAIL_PORT: "1025"
      APP_TENANT_DATASOURCE_PASSWORD: lms_tenant_app_password
      APP_SECURITY_BOOTSTRAP_USERNAME: ops.admin
      APP_SECURITY_BOOTSTRAP_PASSWORD: ChangeMe123!
      APP_SEED_DEMO_PORTFOLIO_ENABLED: "true"
      E2E_API_BASE: http://localhost:8080
      E2E_ADMIN_EMAIL: ops.admin@bhawana.local
      # The bootstrap credential is deliberately one-time. Global setup uses
      # it only to complete the required first-login rotation; specs use the
      # stable post-rotation credential below.
      E2E_ADMIN_INITIAL_PASSWORD: ChangeMe123!
      E2E_ADMIN_PASSWORD: JourneyAdmin456!
      E2E_LSP_UI_READ_EMAIL: lsp.read1@supaone.local
      E2E_LSP_INITIAL_PASSWORD: DemoPass123!

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: |
            pom.xml
            backend/pom.xml
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build backend
        working-directory: backend
        run: ./mvnw -q -DskipTests package

      - name: Start backend
        working-directory: backend
        run: |
          # Flyway creates the tenant role from the placeholders in application.yml, so no
          # separate provisioning step is needed beyond the password above.
          nohup java -jar target/*.jar > "$GITHUB_WORKSPACE/backend.log" 2>&1 &
          echo "backend started, waiting for readiness"

      - name: Wait for backend readiness
        run: |
          for attempt in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health > /dev/null; then
              echo "backend ready after ${attempt} attempts"
              exit 0
            fi
            sleep 5
          done
          echo "backend did not become ready; last 200 log lines:" >&2
          tail -200 "$GITHUB_WORKSPACE/backend.log" >&2
          exit 1

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - run: npx playwright install --with-deps chromium
        working-directory: frontend

      # M17 is explicit that a missing backend must fail rather than skip. The readiness gate
      # above enforces that: if the stack is not up, this job fails loudly instead of reporting
      # a green run over zero executed journeys.
      - name: Run stable backend-connected journeys
        working-directory: frontend
        env:
          # Both are ephemeral seeded CI users; reuse the established stable
          # credential at runtime instead of adding another password literal.
          E2E_LSP_PASSWORD: ${{ env.E2E_ADMIN_PASSWORD }}
        run: >-
          npm run e2e --
          e2e/canary.spec.ts
          e2e/loan-lifecycle.spec.ts
          e2e/responsive.spec.ts

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: journey-playwright-report
          path: frontend/playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload backend log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: journey-backend-log
          path: backend.log
          retention-days: 14
          if-no-files-found: ignore
