name: Contract and Supply Chain

# The gates that catch drift between artifacts, and the ones that catch what we pulled in from
# outside. Neither is about how the code is written, so neither belongs in the per-stack builds.
#
# These run on every push and PR with no path filter on purpose. A contract has at least three
# sides (backend controllers, openapi/openapi.json, frontend generated types); scoping the job to
# one of them is how drift gets in.

on:
  push: {}
  pull_request: {}
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    name: GitHub workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.24"
          cache: false
      - name: Validate GitHub Actions syntax and expressions
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  contract-drift:
    name: API contract drift
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: |
            pom.xml
            backend/pom.xml
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Backend, OpenAPI document and frontend types must agree
        run: ./scripts/contract-drift/check-openapi-drift.sh

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # gitleaks diffs history; a shallow clone silently scans almost nothing.
          fetch-depth: 0
          persist-credentials: false
      - name: Scan history and working tree for committed credentials
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Fail on high or critical advisories
        working-directory: frontend
        # Moderate and below are reported but do not block: the npm advisory database carries a
        # lot of dev-only noise, and a gate that cries wolf gets bypassed within a week.
        run: |
          npm audit --audit-level=high
      - name: Report the full advisory picture
        if: always()
        working-directory: frontend
        run: npm audit || true

  dependency-review:
    name: Dependency change review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Covers dependency changes across both Maven and npm through GitHub's dependency graph.
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
