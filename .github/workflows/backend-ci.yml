name: Backend CI

# Path filters previously listed only backend/** and scripts/schema-diff/**, which left two holes:
# a change to the root pom.xml (parent versions, Java level, module list) triggered no build at
# all, and openapi/openapi.json is a backend-owned contract artifact that only ran frontend CI.
on:
  # Run on every branch push as well as every PR. These jobs are intended to be required checks;
  # workflow-level path filters can leave a required check permanently pending when GitHub skips
  # the entire workflow.
  push: {}
  pull_request: {}
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture:
    name: Architecture fitness functions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: |
            pom.xml
            backend/pom.xml
      # Split out from the main suite deliberately. These are the rules that encode findings the
      # audits actually produced — canonical client IP (H03), cryptographic randomness (H04),
      # scheduled-job concurrency (H12), transaction boundaries (H24), LSP tenant elevation
      # (ADR 0005). They run in seconds, so a violation is reported in under a minute rather
      # than being buried twelve minutes into a full verify.
      - name: Run architecture rules
        working-directory: backend
        run: ./mvnw -q -Dtest='*ArchitectureTest' -DfailIfNoSpecifiedTests=false test

  test:
    name: Tests and coverage ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      APP_TENANT_DATASOURCE_PASSWORD: lms_tenant_app_password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: |
            pom.xml
            backend/pom.xml
      # verify carries the PostgreSQL overlapping-transaction tests (the strongest evidence in
      # this repo) and the JaCoCo ratchet, now at 85% line / 64% branch instead of the old 35%
      # floor that sat 52 points below the real figure.
      - name: Run backend tests with coverage gate
        working-directory: backend
        run: ./mvnw -q verify
      - name: Reject unexpected skipped tests
        run: python3 scripts/quality/check-junit-skips.py backend/target/surefire-reports
      - name: Upload backend verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-verification
          path: |
            backend/target/site/jacoco/
            backend/target/surefire-reports/
          retention-days: 7
          if-no-files-found: ignore

  flyway-reference-schema:
    name: Schema drift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify reference schema artifact matches migrations
        run: |
          chmod +x scripts/schema-diff/*.sh
          ./scripts/schema-diff/test-postgres-readiness.sh
          ./scripts/schema-diff/check-reference.sh
