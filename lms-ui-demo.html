/** Deterministic UUID-shaped identifiers, so short-ids read like the real ones. */
function uid(prefix, n) {
  let h = 0x811c9dc5;
  const seed = `${prefix}:${n}`;
  for (let i = 0; i < seed.length; i += 1) {
    h ^= seed.charCodeAt(i);
    h = Math.imul(h, 0x01000193) >>> 0;
  }
  const hex = (len, salt) => {
    let out = "";
    let x = (h ^ salt) >>> 0;
    while (out.length < len) {
      x = Math.imul(x ^ (x >>> 15), 0x2545f491) >>> 0;
      out += x.toString(16).padStart(8, "0");
    }
    return out.slice(0, len);
  };
  return `${hex(8, 1)}-${hex(4, 2)}-4${hex(3, 3)}-a${hex(3, 4)}-${hex(12, 5)}`;

/* ---------- Repayment schedules + payments ---------- */

function buildSchedule(app) {
  const n = app.tenureMonths;
  const r = app.interestRate / 1200;
  const emi = Math.round((app.requestedAmount * r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1));
  let balance = app.requestedAmount;
  const seed = Number(app.id.slice(1, 6));
  // Where in the schedule "today" sits, and whether the loan is delinquent.
  let paidUpTo;
  if (app.status === "CLOSED") paidUpTo = n;
  else if (app.status === "FORECLOSED") paidUpTo = Math.floor(n * 0.55);
  else if (app.status === "UNDER_REPAYMENT") paidUpTo = Math.max(1, Math.floor(n * 0.45));
  else if (app.status === "DISBURSED") paidUpTo = 0;
  else return [];

  const delinquent = app.status === "UNDER_REPAYMENT" && seed % 3 === 0;
  const partial = app.status === "UNDER_REPAYMENT" && seed % 5 === 0;

  const rows = [];
  for (let i = 0; i < n; i += 1) {
    const interest = Math.round(balance * r);
    const principal = Math.min(balance, emi - interest);
    balance = Math.max(0, balance - principal);
    const monthsFromNow = i - paidUpTo;
    const due = new Date(NOW + monthsFromNow * 30 * DAY);
    let status = "DUE";
    let paid = 0;
    let dpd = 0;
    if (i < paidUpTo) { status = "PAID"; paid = emi; }
    else if (i === paidUpTo && delinquent) { status = "OVERDUE"; dpd = 12 + (seed % 40); }
    else if (i === paidUpTo && partial) { status = "PARTIALLY_PAID"; paid = Math.round(emi * 0.4); }
    if (app.status === "FORECLOSED" && i >= paidUpTo) { status = "PAID"; paid = emi; dpd = 0; }
    rows.push({
      id: `${app.id}-inst-${i + 1}`,
      number: i + 1,
      dueDate: due.toISOString().slice(0, 10),
      principalDue: principal,
      interestDue: interest,
      installmentAmount: principal + interest,
      paidAmount: paid,
      outstandingAmount: Math.max(0, principal + interest - paid),
      dpd,
      status,
      delinquencyBucket: dpd === 0 ? "B0" : dpd <= 30 ? "B1_30" : dpd <= 60 ? "B31_60" : dpd <= 90 ? "B61_90" : "B90_PLUS",
    });
  }
  return rows;
}

/* ---------- Bank transaction register ----------
   One row per money movement on the lender's disbursal / collection account.
   Cr = funds into Bhawana (EMI, fees); Dr = funds out (payouts to borrowers).
   Value date is the bank's effective date, which lags or leads the booking
   (posting) date depending on the channel — NACH presentments settle a day
   after they are booked, RTGS/IMPS settle same-day.                          */

const VALUE_DATE_LAG_DAYS = { NEFT: 0, RTGS: 0, IMPS: 0, UPI: 0, NACH: 1, CHEQUE: 2, BANK_TRANSFER: 1, INTERNAL: 0 };

function valueDateFor(bookingIso, channel) {
  const lag = VALUE_DATE_LAG_DAYS[channel] ?? 0;
  return new Date(new Date(bookingIso).getTime() - lag * DAY).toISOString();
}

const TRANSACTIONS = [];

APPS.forEach((a, ai) => {
  const b = BORROWERS.find((x) => x.id === a.borrowerId);
  const loanId = a.accountNumber || a.externalLoanId;
  const push = (t) => TRANSACTIONS.push({
    id: `${a.id}-txn-${TRANSACTIONS.length}`,
    loanId,
    applicationId: a.id,
    lspId: a.lspId,
    lspName: a.lspName,
    clientName: b.fullName,
    valueDate: valueDateFor(t.bookingDate, t.channel),
    ...t,
  });

  const d = DISBURSEMENTS[a.id];
  if (d) {
    d.attempts.forEach((att) => {
      if (att.status === "SUCCESS") {
        push({
          bookingDate: att.requestedAt, reference: att.utr, drcr: "DR",
          amount: d.netDisbursalAmount, channel: att.paymentMode,
          description: `Loan disbursal to beneficiary ${d.maskedBeneficiaryAccountNumber} (${d.beneficiaryBankName})`,
        });
        push({
          bookingDate: att.requestedAt, reference: `INT${String(660000 + ai * 7)}`, drcr: "CR",
          amount: d.processingFee, channel: "INTERNAL",
          description: `Processing fee recovered at disbursal @ ${a.processingFeeRate}%`,
        });
      } else if (att.status === "FAILED") {
        push({
          bookingDate: att.requestedAt, reference: att.tranRefNo, drcr: "DR",
          amount: d.netDisbursalAmount, channel: att.paymentMode,
          description: `Disbursal attempt ${att.attempt} — returned unpaid by partner bank (${att.failureCode})`,
        });
        push({
          bookingDate: new Date(new Date(att.requestedAt).getTime() + 4 * HOUR).toISOString(),
          reference: `RVSL${String(770000 + ai * 3)}`, drcr: "CR",
          amount: d.netDisbursalAmount, channel: "INTERNAL",
          description: `Reversal of failed disbursal ${att.tranRefNo}`,
        });
      } else if (att.status === "PENDING") {
        push({
          bookingDate: att.requestedAt, reference: att.tranRefNo, drcr: "DR",
          amount: d.netDisbursalAmount, channel: att.paymentMode,
          description: "Disbursal in flight — awaiting terminal status from partner bank",
        });
      }
    });
  }

  (PAYMENTS[a.id] || []).forEach((p) => {
    push({
      bookingDate: p.postedAt, reference: p.reference, drcr: "CR",
      amount: p.amount, channel: p.channel,
      description: `EMI collection — installment ${p.installmentNumber} of ${a.tenureMonths}`,
    });
  });
});

function computeKpis() {
  const disbursed = APPS.filter((a) => DISBURSED_STATUSES.has(a.status));
  const totalDisbursed = disbursed.reduce((t, a) => t + a.requestedAmount, 0);
  let overdueLoans = 0;
  let overdueAmount = 0;
  const buckets = { B0: 0, B1_30: 0, B31_60: 0, B61_90: 0, B90_PLUS: 0 };
  APPS.forEach((a) => {
    const sch = SCHEDULES[a.id];
    if (!sch.length) return;
    const worst = sch.reduce((m, s) => Math.max(m, s.dpd), 0);
    const key = worst === 0 ? "B0" : worst <= 30 ? "B1_30" : worst <= 60 ? "B31_60" : worst <= 90 ? "B61_90" : "B90_PLUS";
    buckets[key] += 1;
    if (worst > 0) {
      overdueLoans += 1;
      overdueAmount += sch.filter((s) => s.status === "OVERDUE" || s.status === "PARTIALLY_PAID").reduce((t, s) => t + s.outstandingAmount, 0);
    }
  });
  // Scale the bucket chart so it reads like a real book rather than a 40-loan sample.
  const SCALE = 14;
  return {
    applicationsAwaitingApproval: APPS.filter((a) => a.status === "AWAITING_APPROVAL").length * 4,
    applicationsInDisbursement: APPS.filter((a) => a.status === "APPROVED_PENDING_DISBURSAL" || a.status === "DISBURSEMENT_RETRY").length * 2,
    totalDisbursedAmount: totalDisbursed * SCALE,
    overdueLoansCount: overdueLoans * SCALE,
    overdueAmount: overdueAmount * SCALE,
    dpdBuckets: Object.entries(buckets).map(([bucket, count]) => ({ bucket, count: count * SCALE })),
    dataAsOf: ago(2 * HOUR),
  };
}

   UI primitives — class strings copied from the real components so the

const esc = (v) =>
  String(v == null ? "" : v).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/**
 * Minimal `tailwind-merge` stand-in.
 *
 * The real components compose classes through `cn()` (clsx + tailwind-merge),
 * which drops an earlier utility when a later one targets the same property.
 * A plain join would emit both and let CSS source order decide the winner —
 * which is how `border-border` lost to the button base's `border-transparent`,
 * and how a subtle badge's tinted border lost to `border-transparent`.
 *
 * Only the conflict groups this file actually uses are classified; anything
 * unrecognised passes through untouched, so the fallback is a plain join.
 */
const TEXT_SIZES = new Set(["xs", "sm", "base", "lg", "xl", "2xl", "3xl", "badge", "eyebrow"]);
const TEXT_ALIGN = new Set(["left", "right", "center", "justify", "start", "end"]);
const FONT_FAMILY = new Set(["sans", "serif", "mono", "heading"]);
const BORDER_SIDE = new Set(["t", "r", "b", "l", "x", "y", "s", "e"]);
/** `bg-*` utilities that are not background-color. */
const BG_NON_COLOR = /^(clip|origin|repeat|no-repeat|cover|contain|auto|fixed|local|scroll|none|gradient|top|bottom|left|right|center|blend|\[length:|\[position:|\[right|\[left|\[top|\[bottom|\[center|\[url)/;
/** `text-*` utilities that are neither colour nor size. */
const TEXT_NON_COLOR = new Set(["wrap", "nowrap", "balance", "pretty", "ellipsis", "clip"]);

function conflictKey(cls) {
  // Variant-prefixed utilities (hover:, dark:, focus-visible:, …) only conflict
  // with the same variant, so the prefix is part of the key.
  const i = cls.lastIndexOf(":");
  const prefix = i === -1 ? "" : cls.slice(0, i + 1);
  const base = i === -1 ? cls : cls.slice(i + 1);
  const body = base.startsWith("!") ? base.slice(1) : base;

  if (body.startsWith("bg-")) {
    const v = body.slice(3);
    // Only background-*color* conflicts here; size/position/repeat/clip are
    // separate properties and must all survive (the select chevron needs
    // `bg-[length:…]`, `bg-[right_…]` and `bg-no-repeat` together).
    if (BG_NON_COLOR.test(v)) return null;
    return `${prefix}bg-color`;
  }
  if (body.startsWith("text-")) {
    const v = body.slice(5).split("/")[0];
    if (TEXT_ALIGN.has(v)) return `${prefix}text-align`;
    if (TEXT_NON_COLOR.has(v)) return null;
    if (TEXT_SIZES.has(v) || /^\[/.test(v)) return `${prefix}text-size`;
    return `${prefix}text-color`;
  }
  if (body.startsWith("font-")) {
    const v = body.slice(5);
    return FONT_FAMILY.has(v) ? `${prefix}font-family` : `${prefix}font-weight`;
  }
  if (body === "border") return `${prefix}border-width`;
  if (/^border-\d+$/.test(body)) return `${prefix}border-width`;
  if (/^border-[trblxyse]$/.test(body)) return `${prefix}border-width-${body.slice(7)}`;
  if (/^border-[trblxyse]-\d+$/.test(body)) return `${prefix}border-width-${body.slice(7, 8)}`;
  if (body.startsWith("border-")) {
    const rest = body.slice(7);
    const side = rest.split("-")[0];
    if (BORDER_SIDE.has(side) && rest.length > side.length) return `${prefix}border-color-${side}`;
    return `${prefix}border-color`;
  }
  return null;
}

function cx(...parts) {
  const tokens = parts.filter(Boolean).join(" ").split(/\s+/).filter(Boolean);
  const seen = new Map();
  const out = [];
  for (const t of tokens) {
    const key = conflictKey(t);
    if (key === null) { out.push(t); continue; }
    if (seen.has(key)) out[seen.get(key)] = null;
    seen.set(key, out.length);
    out.push(t);
  }
  return out.filter(Boolean).join(" ");
}

  outline: "border-border hover:bg-input/50 hover:text-foreground dark:bg-input/30",
  secondary: "bg-secondary text-secondary-foreground",

const BTN_SIZE = {
  default: "h-7 gap-1 px-2 text-xs/relaxed [&_svg:not([class*='size-'])]:size-3.5",

/**
 * `variant: "none"` omits the variant palette entirely. The real components go
 * through `cn()` (tailwind-merge), which drops a variant's `bg-*`/`text-*` when
 * an override supplies its own; without that merge step the two would both be
 * emitted and CSS source order — not call order — would decide the winner.
 */
function button(label, opts = {}) {
  const { variant = "default", size = "default", act, arg, disabled, title, cls = "", iconName, ariaLabel } = opts;
  return `<button type="button"${act ? ` data-act="${esc(act)}"` : ""}${arg != null ? ` data-arg="${esc(arg)}"` : ""}${disabled ? " disabled" : ""}${title ? ` title="${esc(title)}"` : ""}${ariaLabel ? ` aria-label="${esc(ariaLabel)}"` : ""} class="${cx(BTN_BASE, variant === "none" ? "" : BTN_VARIANT[variant], BTN_SIZE[size], cls)}">${iconName ? icon(iconName) : ""}${label ? `<span>${esc(label)}</span>` : ""}</button>`;
}

function tableControls(state) {
  const opt = (key, label, ic) => {
    const on = state.density === key;
    return `<button type="button" role="radio" aria-checked="${on}" data-act="density" data-arg="${key}" data-state="${on ? "on" : "off"}" class="${cx(BTN_BASE, BTN_VARIANT.ghost, "h-7 gap-1.5 px-2 text-xs", on && "bg-surface-muted text-foreground border-border-control !font-semibold border")}">${icon(ic, "size-3.5")}<span>${label}</span></button>`;
  };
  return `<div data-slot="data-table-toolbar" class="flex items-center justify-end gap-2">
    <fieldset role="radiogroup" aria-label="Row density" class="border-border bg-surface rounded-container inline-flex items-center gap-0.5 border p-0.5">
      <legend class="sr-only">Row density</legend>
      ${opt("comfortable", "Comfortable", "Rows3")}${opt("compact", "Compact", "LayoutList")}
    </fieldset>
    ${button("Columns", { variant: "outline", size: "sm", iconName: "Settings2", cls: "gap-2", act: "noop-columns", ariaLabel: "Columns" })}
  </div>`;
}

/**
 * Renders the shared server-paged table shell: toolbar, sticky header,
 * rows, and the footer pager.
 */
function dataTable({ slot, columns, rows, total, page, pageSize, density, ariaLabel, empty, rowAct, rowArg, pageAct, sizeAct, sortAct, sort, hideControls }) {
  const cellPad = density === "compact" ? "px-2.5 py-1.5" : "px-3 py-3";
  const headPad = density === "compact" ? "h-8 px-2.5" : "h-10 px-3";

  const head = columns.map((c) => {
    const num = c.numeric;
    const sorted = sort && sort.by === c.id ? sort.dir : null;
    const inner = c.sortable && sortAct
      ? `<button type="button" data-act="${esc(sortAct)}" data-arg="${esc(c.id)}" class="${cx(BTN_BASE, BTN_VARIANT.ghost, "text-foreground-muted hover:text-foreground -ml-2 h-7 gap-1.5 px-2 text-xs font-medium", num && "ml-0 w-full justify-end")}"><span>${esc(c.header)}</span>${icon(sorted === "asc" ? "ArrowUp" : sorted === "desc" ? "ArrowDown" : "ChevronsUpDown", cx("size-3", sorted ? "text-foreground" : "text-foreground-subtle"))}</button>`
      : `<span class="text-foreground-muted text-xs font-medium${num ? " block w-full text-right" : ""}">${esc(c.header)}</span>`;
    return `<th scope="col" class="text-foreground align-middle font-medium whitespace-nowrap text-left ${headPad}${num ? " text-right" : ""}">${inner}</th>`;
  }).join("");

  const body = rows.length === 0
    ? `<tr class="border-border"><td colspan="${columns.length}" class="p-0">${empty}</td></tr>`
    : rows.map((r) => {
        const interactive = Boolean(rowAct);
        return `<tr${interactive ? ` data-act="${esc(rowAct)}" data-arg="${esc(rowArg(r))}" tabindex="0"` : ""} class="${cx("border-border hover:bg-surface-muted/40 border-b transition-colors duration-150", interactive && "cursor-pointer outline-none")}">
          ${columns.map((c) => `<td class="${cx(cellPad, "align-middle whitespace-nowrap text-foreground text-sm", c.numeric && "text-right font-mono tabular-nums")}">${c.cell(r)}</td>`).join("")}
        </tr>`;
      }).join("");

  const pageCount = Math.max(1, Math.ceil(total / pageSize) || 1);
  const start = total === 0 ? 0 : page * pageSize + 1;
  const end = Math.min(total, (page + 1) * pageSize);
  const pageBtn = (ic, target, dis, lbl) =>
    `<button type="button" data-act="${esc(pageAct)}" data-arg="${target}"${dis ? " disabled" : ""} aria-label="${lbl}" class="${cx(BTN_BASE, BTN_VARIANT.outline, BTN_SIZE["icon-sm"])}">${icon(ic)}</button>`;

  return `<div data-slot="${esc(slot)}" class="flex flex-col gap-2">
    <div class="flex flex-col gap-2">
      ${hideControls ? "" : tableControls({ density })}
      <div data-slot="data-table" data-density="${density}" class="border-border bg-surface shadow-e1 rounded-container border">
        <div class="relative w-full overflow-x-auto">
          <table aria-label="${esc(ariaLabel)}" class="w-full caption-bottom text-xs">
            <thead class="bg-surface-muted sticky top-0 z-10 [&_tr]:border-b"><tr class="border-border border-b">${head}</tr></thead>
            <tbody class="[&_tr:last-child]:border-0">${body}</tbody>
          </table>
        </div>
      </div>
    </div>
    <div data-slot="data-table-pagination" class="flex flex-col items-stretch justify-between gap-3 py-2 sm:flex-row sm:items-center">
      <div class="flex items-center gap-2 text-sm">
        <label class="text-foreground-muted hidden sm:inline">Rows per page</label>
        <select data-act="${esc(sizeAct)}" aria-label="Rows per page" class="${cx(BTN_BASE, BTN_VARIANT.outline, "h-6 w-20 gap-1 px-2 text-xs/relaxed")}">
          ${[10, 25, 50, 100].map((s) => `<option value="${s}"${s === pageSize ? " selected" : ""}>${s}</option>`).join("")}
        </select>
      </div>
      <p class="text-foreground-muted text-center text-sm tabular-nums sm:text-left">${total === 0 ? "No rows" : `Showing ${start.toLocaleString("en-IN")}–${end.toLocaleString("en-IN")} of ${total.toLocaleString("en-IN")}`}</p>
      <div class="flex items-center justify-end gap-1">
        ${pageBtn("ChevronsLeft", 0, page === 0, "Go to first page")}
        ${pageBtn("ChevronLeft", page - 1, page === 0, "Go to previous page")}
        <span class="text-foreground-muted px-2 text-sm tabular-nums">${page + 1} / ${pageCount}</span>
        ${pageBtn("ChevronRight", page + 1, page >= pageCount - 1, "Go to next page")}
        ${pageBtn("ChevronsRight", pageCount - 1, page >= pageCount - 1, "Go to last page")}
      </div>
    </div>
  </div>`;
}

function dialog({ title, description, body, footer, size = "max-w-lg" }) {

    <div class="flex flex-col gap-1.5">

    </div>
    ${body || ""}
    <div class="flex items-center justify-end gap-2">${footer || ""}</div>
    <button type="button" data-act="dialog-close" aria-label="Close" class="text-foreground-muted hover:text-foreground absolute top-4 right-4 rounded-control p-1 outline-none">${icon("X", "size-4")}</button>
  </div>`;
}

function toastStack(toasts) {
  if (!toasts.length) return "";
  return `<div class="pointer-events-none fixed right-4 bottom-4 z-100 flex w-full max-w-sm flex-col gap-2">
    ${toasts.map((t) => `<div role="status" class="${cx("bg-popover rounded-container pointer-events-auto flex items-start gap-2 border border-(--color-border) p-3 text-sm shadow-e2 animate-in fade-in-0 slide-in-from-bottom-2", t.tone === "error" && "border-danger/30", t.tone === "success" && "border-success/30")}">
      ${icon(t.tone === "error" ? "XCircle" : t.tone === "success" ? "CheckCircle2" : "Info", cx("mt-0.5 size-4 shrink-0", t.tone === "error" ? "text-danger" : t.tone === "success" ? "text-success" : "text-info"))}
      <span class="text-foreground flex-1">${esc(t.message)}</span>
    </div>`).join("")}
  </div>`;
}

function delinquencyFor(app) {
  const sch = DB.SCHEDULES[app.id] || [];
  const overdue = sch.filter((s) => s.status === "OVERDUE" || s.status === "PARTIALLY_PAID");
  if (!overdue.length) return { maxDaysPastDue: 0, overdueInstallmentCount: 0, overdueAmount: 0 };
  return {
    maxDaysPastDue: overdue.reduce((m, s) => Math.max(m, s.dpd), 0),
    overdueInstallmentCount: overdue.length,
    overdueAmount: overdue.reduce((t, s) => t + s.outstandingAmount, 0),
  };
}

function docsComplete(app) {
  return (DB.DOCUMENTS[app.id] || []).every((d) => !d.requiredForDisbursement || d.status === "UPLOADED" || d.status === "NOT_REQUIRED");

/* ---------- paging helper ---------- */

function pageSlice(rows, key) {
  const f = S.filters[key];
  const total = rows.length;
  const pageCount = Math.max(1, Math.ceil(total / f.pageSize));
  const page = Math.min(f.page, pageCount - 1);
  return { rows: rows.slice(page * f.pageSize, (page + 1) * f.pageSize), total, page, pageSize: f.pageSize };
}

function sortRows(rows, sort, accessors) {
  if (!sort || !sort.by) return rows;
  const get = accessors[sort.by];
  if (!get) return rows;
  const out = rows.slice().sort((a, b) => {
    const va = get(a); const vb = get(b);
    if (va === vb) return 0;
    return va > vb ? 1 : -1;
  });
  return sort.dir === "desc" ? out.reverse() : out;
}

function filteredApps() {
  const f = S.filters.apps;
  let rows = DB.APPS.slice();
  if (f.q) {
    const q = f.q.toLowerCase();
    rows = rows.filter((a) => a.borrowerName.toLowerCase().includes(q) || (borrowerById(a.borrowerId)?.pan || "").toLowerCase().includes(q) || (borrowerById(a.borrowerId)?.mobile || "").includes(q) || (borrowerById(a.borrowerId)?.city || "").toLowerCase().includes(q));
  }
  if (f.lspLoanId) rows = rows.filter((a) => a.externalLoanId.toLowerCase().includes(f.lspLoanId.toLowerCase()));
  if (f.bhawLoanId) rows = rows.filter((a) => (a.accountNumber || "").toLowerCase().includes(f.bhawLoanId.toLowerCase()));
  if (f.status) rows = rows.filter((a) => appStatus(a) === f.status);
  if (f.lspId) rows = rows.filter((a) => a.lspId === f.lspId);
  if (f.productId) rows = rows.filter((a) => a.productId === f.productId);
  if (f.from) rows = rows.filter((a) => a.disbursedAt && a.disbursedAt.slice(0, 10) >= f.from);
  if (f.to) rows = rows.filter((a) => a.disbursedAt && a.disbursedAt.slice(0, 10) <= f.to);
  return sortRows(rows, f.sort, {
    status: (a) => appStatus(a), requestedAmount: (a) => a.requestedAmount,
    updatedAt: (a) => a.updatedAt, createdAt: (a) => a.createdAt,
  });
}

/** Mirrors lib/lifecycle.ts TRANSITIONS + components/app/lifecycle/actions.ts. */
const TRANSITIONS = [
  { from: "INITIALIZED", to: "AWAITING_APPROVAL", label: "Submit for approval", tone: "default", roles: ["SYSTEM_ADMIN"] },
  { from: "AWAITING_APPROVAL", to: "APPROVED_PENDING_DISBURSAL", label: "Approve", tone: "approve", roles: ["SYSTEM_ADMIN"] },
  { from: "AWAITING_APPROVAL", to: "REJECTED", label: "Reject", tone: "destructive", roles: ["SYSTEM_ADMIN"], requiresReason: true },
  { from: "APPROVED_PENDING_DISBURSAL", to: "DISBURSED", label: "Initiate disbursement", tone: "approve", roles: ["SYSTEM_ADMIN"] },
  { from: "APPROVED_PENDING_DISBURSAL", to: "DISBURSEMENT_RETRY", label: "Mark disbursement retry", tone: "destructive", roles: ["SYSTEM_ADMIN"], requiresReason: true },
  { from: "DISBURSEMENT_RETRY", to: "DISBURSED", label: "New disbursement attempt", tone: "approve", roles: ["SYSTEM_ADMIN"] },
  { from: "UNDER_REPAYMENT", to: "FORECLOSED", label: "Settle foreclosure", tone: "approve", roles: ["SYSTEM_ADMIN"], requiresReason: true },
  { from: "INITIALIZED", to: "INVALID", label: "Mark invalid", tone: "destructive", roles: ["LSP_UI_WRITE", "SYSTEM_ADMIN"], requiresReason: true },
  { from: "AWAITING_APPROVAL", to: "INVALID", label: "Mark invalid", tone: "destructive", roles: ["LSP_UI_WRITE", "SYSTEM_ADMIN"], requiresReason: true },
  { from: "APPROVED_PENDING_DISBURSAL", to: "INVALID", label: "Mark invalid", tone: "destructive", roles: ["LSP_UI_WRITE", "SYSTEM_ADMIN"], requiresReason: true },
  { from: "DISBURSEMENT_RETRY", to: "INVALID", label: "Mark invalid", tone: "destructive", roles: ["LSP_UI_WRITE", "SYSTEM_ADMIN"], requiresReason: true },
];

function actionBar(app) {
  const status = appStatus(app);
  const role = S.role;
  // Foreclosure is owned by the panel below for SYSTEM_ADMIN, so it is hidden here.
  const hidden = role === "SYSTEM_ADMIN" ? new Set(["FORECLOSED"]) : new Set();
  const all = TRANSITIONS.filter((t) => t.from === status);
  const visible = all.filter((t) => !hidden.has(t.to));

  if (visible.length === 0) {
    return all.length > 0 ? "" : `<div data-slot="action-bar" class="flex flex-col gap-2"><div class="flex flex-wrap items-center gap-2" role="group" aria-label="Loan actions">
      <p class="text-foreground-muted text-sm">No actions available from this status.</p></div></div>`;
  }

  const gates = { docsComplete: docsComplete(app), scheduleValid: scheduleValid(app), kyc: borrowerById(app.borrowerId).kycComplete };

  const buttons = visible.map((t) => {
    let reason = null;
    if (!t.roles.includes(role)) reason = `Your role (${ROLE_LABELS[role]}) cannot perform this transition.`;
    else if (t.to === "APPROVED_PENDING_DISBURSAL" && !gates.kyc) reason = "KYC is not complete for this borrower (BR-4).";
    else if (t.to === "DISBURSED" && !gates.docsComplete) reason = "One or more required-for-disbursement documents are not uploaded (BR-3).";
    else if (t.to === "DISBURSED" && !gates.scheduleValid) reason = "No valid repayment schedule is attached (BR-10).";
    const mutedApprove = reason && t.tone === "approve";
    const variant = mutedApprove ? "none" : t.tone === "destructive" ? "destructive" : t.tone === "approve" ? "default" : "outline";
    const disabledCls = mutedApprove ? "bg-surface-muted text-foreground-muted hover:bg-surface-muted border-border border opacity-70" : "";
    return `<span title="${esc(reason || "")}">${button(t.label, {
      variant, act: reason ? "" : "transition", arg: `${app.id}|${t.to}`,
      disabled: Boolean(reason), cls: disabledCls,
    })}</span>`;
  }).join("");

  return `<div data-slot="action-bar" class="flex flex-col gap-2">
    <div class="flex flex-wrap items-center gap-2" role="group" aria-label="Loan actions">${buttons}</div>
  </div>`;
}

function blockingIssues(app) {
  const status = appStatus(app);
  const d = delinquencyFor(app);
  const b = borrowerById(app.borrowerId);

  if (status === "REJECTED") {
    return `<div class="border-danger/30 bg-danger/5 rounded-container border p-4">
      <p class="text-foreground text-sm font-semibold">Application rejected</p>
      <p class="text-foreground-muted mt-1 text-sm">${esc(app.rejectionReason || "")}</p></div>`;
  }
  if (status === "INVALID") {
    return `<div class="border-revoked/30 bg-revoked/10 rounded-container border p-4">
      <p class="text-foreground text-sm font-semibold">Marked invalid by the LSP</p>
      <p class="text-foreground-muted mt-1 text-sm">${esc(app.invalidReason || "")}</p>
      <p class="text-foreground-muted mt-1 text-xs">Invalidated ${esc(formatDateTime(app.invalidatedAt))}.</p></div>`;
  }
  if (status === "DISBURSEMENT_RETRY") {
    const dsb = DB.DISBURSEMENTS[app.id];
    const failed = dsb?.attempts?.find((x) => x.status === "FAILED");
    return `<div class="border-warning/30 bg-warning/10 rounded-container border p-4">
      <p class="text-foreground text-sm font-semibold">Disbursement did not complete</p>
      <p class="text-foreground-muted mt-1 text-sm">${esc(failed ? `${failed.failureCode} — ${failed.failureReason}` : "The last payout attempt failed.")}</p>
      <p class="text-foreground-muted mt-1 text-xs">A new disbursement attempt is required. Money did not leave the sponsor account.</p></div>`;
  }
  if (!b.kycComplete && (status === "INITIALIZED" || status === "AWAITING_APPROVAL")) {
    return `<div class="border-warning/30 bg-warning/10 rounded-container border p-4">
      <p class="text-foreground text-sm font-semibold">KYC incomplete</p>
      <p class="text-foreground-muted mt-1 text-sm">Approval is blocked until the borrower's KYC is complete (BR-4).</p></div>`;
  }
  if (d.maxDaysPastDue > 0) {
    return `<div class="border-danger/30 bg-danger/5 rounded-container border p-4">
      <p class="text-foreground text-sm font-semibold">Loan is delinquent</p>
      <p class="text-foreground mt-1 text-sm tabular-nums">Active overdue amount: ${formatINR(d.overdueAmount)}</p>
      <p class="text-foreground-muted mt-1 text-xs">Per-installment DPD / bucket detail is available on the Repayments tab.</p></div>`;
  }
  if (status === "APPROVED_PENDING_DISBURSAL") {
    return `<div class="border-info/30 bg-info/5 rounded-container border p-4">
      <p class="text-foreground text-sm font-semibold">Awaiting disbursement</p>
      <p class="text-foreground-muted mt-1 text-sm">The loan has been approved and is queued for disbursement. The payout adapter will pick it up on the next scheduler tick.</p></div>`;
  }
  return "";
}

      ${detailSection("Lending service provider", [
        detailRow("Name", esc(lsp.name)),
        detailRow("LSP id", `<code class="bg-surface-muted rounded px-1.5 py-0.5 font-mono text-xs">${esc(lsp.id)}</code>`),
      ].join(""))}
      <section class="border-border bg-surface rounded-container border p-4 lg:col-span-2">
        <h2 class="text-foreground mb-3 text-sm font-semibold tracking-tight">Lifecycle gates</h2>
        <div class="flex flex-wrap items-center gap-2">
          ${gateChip(dc, dc ? "Docs complete" : "Docs incomplete", "BR-3 — every required-for-disbursement document must be uploaded.")}
          ${gateChip(sv, sv ? "Schedule valid" : "Schedule missing", "BR-10 — a valid repayment schedule must exist before disbursement.")}
        </div>
      </section>
    </div>
  </div>`;
}

function scheduleSummaryStrip(inst) {
  const total = inst.reduce((t, i) => t + i.installmentAmount, 0);
  const outstanding = inst.reduce((t, i) => t + i.outstandingAmount, 0);
  const today = new Date(DB.NOW).toISOString().slice(0, 10);
  const asOfToday = inst.filter((i) => i.dueDate <= today).reduce((t, i) => t + i.outstandingAmount, 0);
  const item = (label, value) => `<div class="flex flex-col gap-0.5">
    <dt class="text-foreground-muted text-eyebrow flex items-center gap-0.5 uppercase"><span>${esc(label)}</span></dt>
    <dd class="text-foreground text-sm font-medium tabular-nums">${value}</dd></div>`;
  return `<dl class="border-border bg-surface-muted/40 rounded-container grid grid-cols-1 gap-3 border px-3 py-2.5 text-sm sm:grid-cols-3">
    ${item("Total installment amount", formatINR(total, { decimals: 2 }))}
    ${item("Total outstanding", formatINR(outstanding, { decimals: 2 }))}
    ${item("Outstanding as of today", formatINR(asOfToday, { decimals: 2 }))}
  </dl>`;
}

function tabSchedule(app) {
  const status = appStatus(app);
  const inst = DB.SCHEDULES[app.id] || [];
  const dc = docsComplete(app);
  const sv = scheduleValid(app);
  const preDisb = status === "APPROVED_PENDING_DISBURSAL" || status === "DISBURSEMENT_RETRY";

  const gateBanner = preDisb && (!dc || !sv)
    ? `<div role="status" class="border-warning/30 bg-warning/10 rounded-container flex items-start gap-3 border p-4 text-sm">
        ${icon("AlertTriangle", "text-warning mt-0.5 h-5 w-5 shrink-0")}
        <div class="flex flex-col gap-1"><p class="text-foreground font-semibold">Disbursement is blocked</p>
        <ul class="text-foreground-muted list-inside list-disc">
          ${!dc ? "<li>Required-for-disbursement documents are missing (BR-3).</li>" : ""}
          ${!sv ? "<li>No valid repayment schedule is attached (BR-10).</li>" : ""}
        </ul></div></div>`
    : "";

  if (status === "APPROVED_PENDING_DISBURSAL" && inst.length === 0) {
    return `<div class="flex flex-col gap-4">${gateBanner}
      <div role="status" class="border-info/30 bg-info/5 text-foreground rounded-container flex items-start gap-3 border p-4 text-sm">
        ${icon("Inbox", "text-info mt-0.5 h-5 w-5 shrink-0")}
        <div class="flex flex-col gap-1"><p class="font-semibold">Awaiting LSP schedule</p>
        <p class="text-foreground-muted">This application is approved but no repayment schedule has been submitted by the LSP yet.</p></div>
      </div></div>`;
  }
  if (inst.length === 0) {
    return `<div class="flex flex-col gap-4">${gateBanner}${emptyState({ icon: "CalendarClock", title: "No repayment schedule yet", description: "A repayment schedule becomes available once the loan is approved and a loan account is created." })}</div>`;
  }

  const canPost = (S.role === "SYSTEM_ADMIN" || S.role === "OPS_USER") && (status === "DISBURSED" || status === "UNDER_REPAYMENT");
  const nextDue = inst.find((i) => i.status !== "PAID");

  const head = ["#", "Due date", "Principal", "Interest", "Installment", "Paid", "Outstanding", "Status", "DPD", ""];
  const numeric = [false, false, true, true, true, true, true, false, true, true];

  return `<div data-slot="schedule-tab" data-density="compact" class="flex flex-col gap-4">
    ${gateBanner}
    <div data-slot="schedule-table" class="flex flex-col gap-2">
      ${scheduleSummaryStrip(inst)}
      <div class="border-border bg-surface shadow-e1 rounded-container overflow-hidden border">
        <div class="relative w-full overflow-x-auto">
          <table aria-label="Repayment schedule" class="w-full caption-bottom text-xs">
            <thead class="bg-surface-muted/60 [&_tr]:border-b"><tr class="border-border border-b">
              ${head.map((h, i) => `<th scope="col" class="text-foreground h-8 px-2.5 align-middle text-xs font-medium whitespace-nowrap ${numeric[i] ? "text-right" : "text-left"}">${h ? esc(h) : '<span class="sr-only">Actions</span>'}</th>`).join("")}
            </tr></thead>
            <tbody class="[&_tr:last-child]:border-0">
              ${inst.map((i) => {
                const v = INSTALLMENT_VISUAL[i.status];
                const showAction = canPost && nextDue && i.id === nextDue.id && i.outstandingAmount > 0;
                return `<tr data-status="${i.status}" class="border-border hover:bg-muted/50 border-b transition-colors">
                  <td class="text-foreground-muted px-2.5 py-2 text-sm whitespace-nowrap tabular-nums">${i.number}</td>
                  <td class="text-foreground px-2.5 py-2 text-sm whitespace-nowrap">${esc(formatDate(i.dueDate))}</td>
                  <td class="px-2.5 py-2 text-right text-sm whitespace-nowrap tabular-nums">${formatINR(i.principalDue, { decimals: 2 })}</td>
                  <td class="px-2.5 py-2 text-right text-sm whitespace-nowrap tabular-nums">${formatINR(i.interestDue, { decimals: 2 })}</td>
                  <td class="px-2.5 py-2 text-right text-sm font-medium whitespace-nowrap tabular-nums">${formatINR(i.installmentAmount, { decimals: 2 })}</td>
                  <td class="px-2.5 py-2 text-right text-sm whitespace-nowrap tabular-nums">${formatINR(i.paidAmount, { decimals: 2 })}</td>
                  <td class="px-2.5 py-2 text-right text-sm whitespace-nowrap tabular-nums">${formatINR(i.outstandingAmount, { decimals: 2 })}</td>
                  <td class="px-2.5 py-2 text-sm whitespace-nowrap">${badge(v.label, v.cls, v.icon)}</td>
                  <td class="px-2.5 py-2 text-right text-sm whitespace-nowrap tabular-nums">${i.dpd > 0 ? `<span class="text-danger font-medium">${i.dpd}</span>` : `<span class="text-foreground-muted">—</span>`}</td>
                  <td class="px-2.5 py-2 text-right text-sm whitespace-nowrap">${showAction ? button("Record payment", { size: "sm", variant: "outline", act: "record-payment", arg: `${app.id}|${i.id}` }) : ""}</td>
                </tr>`;
              }).join("")}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>`;
}

function tabDocuments(app) {
  const docs = (DB.DOCUMENTS[app.id] || []).concat(S.extraDocs[app.id] || []);
  const required = docs.filter((d) => d.requiredForApproval || d.requiredForDisbursement);
  const optional = docs.filter((d) => !d.requiredForApproval && !d.requiredForDisbursement && d.status !== "NOT_REQUIRED");
  const notRequired = docs.filter((d) => d.status === "NOT_REQUIRED");

  const row = (d) => {
    const uploaded = d.status === "UPLOADED";
    return `<div class="border-border bg-surface rounded-container flex flex-wrap items-start justify-between gap-3 border p-4">
      <div class="min-w-0">
        <div class="flex flex-wrap items-center gap-2">
          <span class="text-foreground text-sm font-semibold">${esc(d.displayName)}</span>
          ${uploaded ? badge("Uploaded", "border-primary/30 bg-primary/10 text-primary-tinted", "FileText")
            : d.status === "NOT_REQUIRED" ? badge("Not required", INTENT_CLASSES.neutral.subtle, "MinusCircle")
            : badge("Pending", INTENT_CLASSES.warning.subtle, "Hourglass", "text-warning")}
          ${d.requiredForDisbursement ? badge("Required before disbursement", INTENT_CLASSES.neutral.subtle, "Shield") : ""}
          ${d.requiredForApproval && !d.requiredForDisbursement ? badge("Required before approval", INTENT_CLASSES.neutral.subtle, "Shield") : ""}
        </div>
        ${uploaded
          ? `<p class="text-foreground-muted mt-1 text-xs"><span class="font-mono">${esc(d.fileName)}</span> · ${esc(bytes(d.sizeBytes))} · ${esc(d.mime)}</p>
             <p class="text-foreground-muted mt-0.5 text-xs">Uploaded ${esc(formatDateTime(d.uploadedAt))} (${esc(formatRelative(d.uploadedAt))})</p>`
          : `<p class="text-foreground-muted mt-1 text-xs">No file attached yet.</p>`}
      </div>
      ${uploaded ? `<div class="flex shrink-0 items-center gap-2">
        ${button("View", { variant: "ghost", iconName: "Eye", act: "doc-view", arg: `${app.id}|${d.id}` })}
        ${button("Download", { variant: "ghost", iconName: "Download", act: "doc-download", arg: `${app.id}|${d.id}` })}
      </div>` : `<div class="flex shrink-0 items-center gap-2">${button("Upload", { variant: "outline", iconName: "FileUp", act: "doc-upload", arg: `${app.id}|${d.id}` })}</div>`}
    </div>`;
  };

  const group = (label, list) => (list.length === 0 ? "" : `<section class="flex flex-col gap-2">
    <p class="text-foreground-subtle text-eyebrow uppercase">${esc(label)}</p>${list.map(row).join("")}</section>`);

  return `<div class="flex flex-col gap-5">
    <div class="flex items-center justify-between gap-2">
      <p class="text-foreground-muted text-sm">${docs.filter((d) => d.status === "UPLOADED").length} of ${docs.length} documents on file.</p>
      ${button("Download all", { variant: "outline", iconName: "Download", act: "doc-download-all", arg: app.id })}
    </div>
    ${group("Required for this loan", required)}
    ${group("Supporting documents", optional)}
    ${group("Not required for this loan", notRequired)}
  </div>`;
}

function tabRepayments(app) {
  const pays = (DB.PAYMENTS[app.id] || []).concat(S.extraPayments[app.id] || []);
  if (pays.length === 0) {
    return emptyState({ icon: "Receipt", title: "No payments posted yet", description: "Repayments will appear here once the borrower posts the first installment." });
  }
  return `<div class="flex flex-col gap-4">${dataTable({
    slot: "repayments-table", density: "comfortable", hideControls: true, ariaLabel: "Posted repayments",
    rows: pays, total: pays.length, page: 0, pageSize: 100, pageAct: "noop", sizeAct: "noop",
    columns: [
      { id: "postedAt", header: "Posted at", cell: (r) => absRel(r.postedAt) },
      { id: "amount", header: "Amount", numeric: true, cell: (r) => formatINR(r.amount, { decimals: 2 }) },
      { id: "mode", header: "Mode", cell: (r) => `<span class="text-foreground text-sm">${esc(r.channel)}</span>` },
      { id: "status", header: "Status", cell: (r) => paymentStatusBadge(r.status) },
      { id: "reference", header: "Reference", cell: (r) => `<code class="text-foreground-muted font-mono text-xs">${esc(r.reference)}</code>` },
      { id: "transactionId", header: "Transaction", cell: (r) => `<code class="text-foreground-muted font-mono text-xs">${esc(r.id.slice(-12))}</code>` },
    ],
    empty: "",
  }).replace(/<div data-slot="data-table-pagination"[\s\S]*?<\/div>\s*<\/div>$/, "</div>")}</div>`;
}

function tabActivity(app) {
  const events = DB.AUDIT.filter((e) => e.loanApplicationId === app.id).slice(0, 8)
    .concat(S.extraEvents[app.id] || []);
  const sorted = events.slice().sort((a, b) => (a.occurredAt < b.occurredAt ? 1 : -1));
  if (sorted.length === 0) {
    return emptyState({ icon: "History", title: "No activity yet", description: "Status transitions and other lifecycle events will appear here." });
  }
  return `<ol class="flex flex-col gap-3">${sorted.map((e) => `<li class="border-border bg-surface rounded-container flex items-start gap-3 border p-4">
    <span class="bg-surface-muted text-foreground-muted mt-0.5 inline-flex size-7 shrink-0 items-center justify-center rounded-full">${icon("History", "size-3.5")}</span>
    <div class="flex min-w-0 flex-1 flex-col gap-1">
      <div class="flex flex-wrap items-baseline gap-x-2">
        <span class="text-foreground text-sm font-medium">${esc(e.summary)}</span>
        <span class="text-foreground-muted text-xs">${esc(e.action)}</span>
      </div>
      <div class="text-foreground-muted flex flex-wrap items-center gap-x-2 text-xs">
        <span>${esc(e.actorUsername)}</span><span aria-hidden="true">·</span>${absRel(e.occurredAt)}
        <span aria-hidden="true">·</span><code class="font-mono">${esc(e.correlationId)}</code>
      </div>
    </div></li>`).join("")}</ol>`;
}

function screenLoanApplicationDetail(id) {
  const app = appById(id);
  if (!app) {
    return `<div class="flex flex-col gap-6 p-6">${emptyState({
      icon: "FileSearch", title: "Application not found",
      description: "This loan application either doesn't exist or you don't have permission to view it.",
      action: button("Back to applications", { act: "go", arg: "#/loan-applications" }),
    })}</div>`;
  }
  S.breadcrumbLabel = app.externalLoanId;

  if (S.uiState === "forbidden") {
    return `<div class="flex flex-col gap-6 p-6">${emptyState({
      variant: "no-permission", icon: "ShieldAlert", title: "No access to this application",
      description: "You don't have permission to view this loan application.",
      action: button("Back to applications", { act: "go", arg: "#/loan-applications" }),
    })}</div>`;
  }
  if (S.uiState === "error") {
    return `<div class="flex flex-col gap-6 p-6">${errorState({ title: "Couldn't load this application", description: "Please try again.", retryAct: "demo-normal", correlationId: "corr-8810442" })}</div>`;
  }
  if (S.uiState === "loading") {
    return `<div class="flex flex-col gap-6 p-6 xl:flex-row xl:items-start xl:gap-8">
      <div class="min-w-0 flex-1 space-y-6">
        <div class="flex flex-col gap-4">${skeleton("h-3 w-48")}${skeleton("h-8 w-72")}${skeleton("h-4 w-40")}
          <div class="flex flex-wrap gap-2">${skeleton("h-9 w-28")}${skeleton("h-9 w-28")}${skeleton("h-9 w-28")}</div></div>
        <div class="border-border flex flex-wrap gap-2 border-b pb-2">${Array.from({ length: 5 }).map(() => skeleton("h-8 w-20")).join("")}</div>
        ${skeleton("h-64 w-full rounded-card")}
      </div>
      <div class="hidden w-72 shrink-0 xl:block">${skeleton("h-56 w-full rounded-card")}</div>
    </div>`;
  }

  const status = appStatus(app);
  const d = delinquencyFor(app);
  const tab = S.appTab;
  const b = borrowerById(app.borrowerId);

  const tabsNav = `<div class="flex flex-col gap-4">
    <div role="tablist" aria-label="Loan application sections" class="border-border flex flex-wrap items-center gap-1 border-b">
      ${APP_TABS.map(([v, label]) => `<button type="button" role="tab" aria-selected="${tab === v}" data-act="app-tab" data-arg="${v}" data-state="${tab === v ? "active" : "inactive"}"
        class="${cx("border-b-2 border-transparent px-3 py-2 text-sm font-medium transition-colors outline-none",
          tab === v ? "text-foreground border-foreground" : "text-foreground-muted hover:text-foreground")}">${esc(label)}</button>`).join("")}
    </div>
    <div>${tab === "overview" ? tabOverview(app) : tab === "schedule" ? tabSchedule(app) : tab === "documents" ? tabDocuments(app) : tab === "repayments" ? tabRepayments(app) : tabActivity(app)}</div>
  </div>`;

  const preDisbursement = ["INITIALIZED", "AWAITING_APPROVAL", "APPROVED_PENDING_DISBURSAL", "DISBURSEMENT_RETRY"].includes(status);
  const railItem = (label, value, cls = "text-sm") => `<div class="flex flex-col gap-1">
    <div class="text-foreground-muted text-xs tracking-wide uppercase">${esc(label)}</div>
    <div class="text-foreground ${cls}">${value}</div></div>`;

  const rail = `<section data-slot="detail-summary" class="border-border bg-surface rounded-container flex flex-col gap-4 border p-4">
    <h2 class="text-foreground text-sm font-semibold tracking-tight">At a glance</h2>
    ${d.maxDaysPastDue > 0
      ? `<div class="flex flex-col gap-1">
          <div class="text-foreground-muted text-xs tracking-wide uppercase">Delinquency</div>
          <div class="text-foreground text-sm tabular-nums">${d.maxDaysPastDue} day${d.maxDaysPastDue === 1 ? "" : "s"} past due</div>
          <div class="text-foreground-muted text-xs">${d.overdueInstallmentCount} overdue installment${d.overdueInstallmentCount === 1 ? "" : "s"}</div>
        </div>`
      : railItem("Repayment", preDisbursement ? "Awaiting disbursement" : "On track")}
    ${railItem("Documents", docsComplete(app) ? "Docs complete" : "Docs incomplete")}
    ${railItem("Schedule", scheduleValid(app) ? "Schedule valid" : "Schedule invalid")}
    ${railItem("Interest rate", `${app.interestRate}%`, "text-sm tabular-nums")}
    ${app.accountNumber ? railItem("Loan account", `<span class="font-mono text-xs">${esc(app.accountNumber)}</span>`) : ""}
  </section>`;

  const opsBar = S.role === "OPS_USER"
    ? `<div class="flex flex-col gap-2">
        <p class="text-foreground-muted text-sm">Approvals and lifecycle changes are automated. Use Escalate to admin if this loan needs out-of-band intervention.</p>
        <div class="flex flex-wrap items-center gap-2" role="group" aria-label="Loan actions">
          ${button("Escalate to admin", { variant: "outline", iconName: "AlertTriangle", act: "escalate", arg: app.id })}
        </div></div>`
    : actionBar(app);

  return `<div class="flex flex-col gap-6 p-6 xl:flex-row xl:items-start xl:gap-8">
    <div class="min-w-0 flex-1 space-y-6">
      <div data-slot="detail-header" class="flex flex-col gap-4">
        ${pageHeader({
          eyebrow: `Loan application · ${app.externalLoanId}`,
          title: b.fullName,
          description: `Application ${shortId(app.id)}`,
          actions: `<div class="flex items-center gap-2">${statusBadge(status, { delinquency: d })}</div>`,
        })}
        ${opsBar}
        ${S.role === "SYSTEM_ADMIN" ? foreclosurePanel(app) : ""}
      </div>
      ${tabsNav}
    </div>
    <aside data-slot="right-rail" aria-label="Detail sidebar" class="sticky top-[88px] hidden w-72 shrink-0 xl:block">${rail}</aside>
  </div>`;
}

function screenBorrowers() {
  const f = S.filters.borrowers;
  const header = pageHeader({ title: "Borrowers", description: "Browse and search the borrower directory across every LSP." });
  const gate = stateGate({
    forbiddenTitle: "No access to borrowers",
    forbiddenDescription: "The borrower directory is restricted to internal users with the appropriate permissions.",
    errorTitle: "Couldn't load borrowers",
    errorDescription: "The directory couldn't be fetched. Try again in a moment.",
  });

  let rows = S.uiState === "empty" ? [] : DB.BORROWERS.slice();
  if (f.q) {
    const q = f.q.toLowerCase();
    rows = rows.filter((b) => b.fullName.toLowerCase().includes(q) || b.pan.toLowerCase().includes(q) || b.mobile.includes(q) || b.email.toLowerCase().includes(q));
  }
  const slice = pageSlice(rows, "borrowers");

  const bar = filterShell({
    slot: "borrowers-filter-bar", label: "Borrowers filters", variant: "bare",
    children: searchField({ act: "borrowers-q", value: f.q, placeholder: "Search by name, PAN, mobile, or email", cls: "max-w-sm min-w-[260px]" })
      + button("Clear", { variant: "ghost", size: "sm", iconName: "X", act: "borrowers-clear", disabled: !f.q, cls: "gap-1", ariaLabel: "Clear all filters" }),
  });

  const body = gate ? gate : S.uiState === "loading" ? tableSkeleton(6, 10) : dataTable({
    slot: "borrowers-table", density: S.density, ariaLabel: "Borrowers",
    rows: slice.rows, total: slice.total, page: slice.page, pageSize: slice.pageSize,
    rowAct: "open-borrower", rowArg: (r) => r.id, pageAct: "borrowers-page", sizeAct: "borrowers-size",
    columns: [
      { id: "fullName", header: "Borrower", cell: (r) => `<div class="flex flex-col"><span class="font-medium">${esc(r.fullName)}</span><span class="text-foreground-muted font-mono text-xs">${esc(shortId(r.id))}</span></div>` },
      { id: "pan", header: "PAN", cell: (r) => `<span class="font-mono text-xs">${esc(r.pan)}</span>` },
      { id: "mobile", header: "Mobile", cell: (r) => `<span class="tabular-nums">${esc(r.mobile)}</span>` },
      { id: "email", header: "Email", cell: (r) => esc(r.email) },
      { id: "location", header: "Location", cell: (r) => esc(`${r.city}, ${r.state}`) },
      { id: "aadhaar", header: "Aadhaar", cell: (r) => `<span class="font-mono text-xs">${esc(r.aadhaarMasked)}</span>` },
    ],
    empty: emptyState({ variant: "filtered-empty", icon: "Users", title: "No borrowers match these filters.", description: "Clear the search or widen the criteria." }),
  });

  return `<div class="flex flex-col gap-6 p-6" data-page="borrowers">${header}${bar}${body}</div>`;
}

    ].join(""))}
    ${detailSection("Employment", [
      detailRow("Type", esc(b.employmentType === "SALARIED" ? "Salaried" : "Self-employed")),
      detailRow("Organization", esc(b.organization)),
      detailRow("Employee ID", b.employeeId ? esc(b.employeeId) : null),
      detailRow("Location", esc(b.employmentCity)),
      detailRow("Monthly income", formatINR(b.monthlyIncome)),

const REPORT_TYPES = {

  },

/**
 * Credit / debit totals for the filtered window, so the register foots to a
 * net movement rather than leaving the reader to add the column up.
 */
function txnTotalsStrip(txns) {
  const cr = txns.filter((t) => t.drcr === "CR").reduce((s, t) => s + t.amount, 0);
  const dr = txns.filter((t) => t.drcr === "DR").reduce((s, t) => s + t.amount, 0);
  const item = (label, value, cls = "") => `<div class="flex flex-col gap-0.5">
    <dt class="text-foreground-muted text-eyebrow uppercase">${esc(label)}</dt>
    <dd class="text-foreground text-sm font-medium tabular-nums ${cls}">${value}</dd></div>`;
  return `<dl class="border-border bg-surface-muted/40 rounded-container grid grid-cols-1 gap-3 border px-3 py-2.5 text-sm sm:grid-cols-4">
    ${item("Transactions", txns.length.toLocaleString("en-IN"))}
    ${item("Total credits (Cr)", formatINR(cr, { decimals: 2 }), "text-success")}
    ${item("Total debits (Dr)", formatINR(dr, { decimals: 2 }), "text-info")}
    ${item("Net movement", formatINR(cr - dr, { decimals: 2 }))}
  </dl>`;
}

/** Cr = funds into Bhawana, Dr = funds out. Colour + icon + text, never colour alone. */
function drcrBadge(drcr) {
  return drcr === "CR"
    ? badge("Cr", "border-success/30 bg-success/10 text-success", "ArrowDown", "text-success")
    : badge("Dr", "border-info/30 bg-info/10 text-info", "ArrowUp", "text-info");
}

    rows = rows.filter((a) => a.borrowerName.toLowerCase().includes(q) || a.externalLoanId.toLowerCase().includes(q));
  }
  if (f.status) rows = rows.filter((a) => appStatus(a) === f.status);
  const slice = pageSlice(rows, "myLoans");

  const bar = filterShell({
    slot: "my-loans-filter-bar", label: "My loans filters",
    children: searchField({ act: "myloans-q", value: f.q, placeholder: "Search borrower or reference" })
      + selectField({ act: "myloans-status", value: f.status, placeholder: "All statuses", options: Object.keys(STATUS_META).map((s) => ({ value: s, label: STATUS_META[s].label })) }),
  });

  const body = S.uiState === "loading" ? tableSkeleton(5, 8) : dataTable({
    slot: "my-loans-table", density: S.density, ariaLabel: "My loans",
    rows: slice.rows, total: slice.total, page: slice.page, pageSize: slice.pageSize,
    rowAct: "open-my-loan", rowArg: (r) => r.id, pageAct: "myloans-page", sizeAct: "myloans-size",
    columns: [
      { id: "externalLoanId", header: "Reference", cell: (r) => `<span class="text-primary-tinted font-mono text-xs">${esc(r.externalLoanId)}</span>` },
      { id: "borrowerFullName", header: "Borrower", cell: (r) => esc(r.borrowerName) },
      { id: "productName", header: "Product", cell: (r) => `<span class="text-foreground-muted">${esc(r.productName)}</span>` },
      { id: "requestedAmount", header: "Amount", numeric: true, cell: (r) => `<span class="tabular-nums">${formatINR(r.requestedAmount)}</span>` },
      { id: "status", header: "Status", cell: (r) => statusBadge(appStatus(r), { delinquency: delinquencyFor(r) }) },
    ],
    empty: hasFilters
      ? emptyState({ icon: "SearchX", title: "No loans match these filters", description: "Try a different search term or status, or clear the filters to see the full book." })
      : emptyState({ icon: "Folder", title: "No loans yet", description: "When your LSP originates loans through Bhawana, they will appear here." }),
  });

  return `<div class="flex flex-col gap-6 p-6">${header}${bar}${body}</div>`;
}

const S = {
  signedIn: false,
  role: "SYSTEM_ADMIN",
  route: "#/home",
  theme: "light",
  density: "comfortable",
  uiState: "normal",
  demoBarOpen: true,
  appTab: "overview",
  borrowerTab: "profile",
  foreclosureOpen: false,
  rulesOpen: false,
  breadcrumbLabel: null,
  showIgnoredFilterNotice: false,
  // Pre-filled so a reviewer can press Sign in straight away; clearing a
  // field still demonstrates the form's validation state.
  loginEmail: "siddhant@bhawanafinance.com", loginPassword: "demo-password",
  loginRole: "SYSTEM_ADMIN", loginShowPassword: false, loginError: null,
  filters: initialFilters(),
  statusOverrides: {},
  userStatusOverrides: {},
  ackedAlerts: {},
  extraPayments: {},
  extraEvents: {},
  extraDocs: {},
  extraReports: [],
  tempPassword: null,
  revealedSecret: null,
  dialog: null,
  toasts: [],
};

/* ---------- routing ---------- */

function parseRoute() {
  const raw = location.hash || defaultLandingFor(S.role);
  return raw.split("?")[0];
}

function renderRoute() {
  const r = S.route;
  const segs = r.replace(/^#\//, "").split("/").filter(Boolean);
  const head = segs[0] || "home";
  const id = segs[1];

  // Role gates mirror routes/router.tsx.
  const allowed = {
    home: ["SYSTEM_ADMIN"],
    "loan-applications": ["SYSTEM_ADMIN", "OPS_USER"],
    borrowers: ["SYSTEM_ADMIN", "OPS_USER"],
    alerts: ["SYSTEM_ADMIN", "OPS_USER"],
    reports: ["SYSTEM_ADMIN"],
    lsps: ["SYSTEM_ADMIN"],
    products: ["SYSTEM_ADMIN", "PRODUCT_ADMIN"],
    users: ["SYSTEM_ADMIN"],
    "api-clients": ["SYSTEM_ADMIN"],
    audit: ["SYSTEM_ADMIN"],
    "my-loans": ["LSP_UI_READ", "LSP_UI_WRITE"],
  }[head];

  if (allowed && !allowed.includes(S.role)) {
    return `<div class="flex flex-col gap-6 p-6">${emptyState({
      variant: "no-permission", icon: "ShieldAlert", title: "You don't have access to this page",
      description: `This screen is available to ${allowed.map((r2) => ROLE_LABELS[r2]).join(" or ")}. You are signed in as ${ROLE_LABELS[S.role]}.`,
      action: button("Go to your workspace", { act: "go", arg: defaultLandingFor(S.role) }),
    })}</div>`;
  }

  switch (head) {
    case "home": return screenHome();
    case "loan-applications": return id ? screenLoanApplicationDetail(id) : screenLoanApplications();
    case "borrowers": return id ? screenBorrowerDetail(id) : screenBorrowers();
    case "alerts": return screenAlerts();
    case "reports": return screenReports();
    case "lsps": return screenLsps();
    case "products": return screenProducts();
    case "users": return screenUsers();
    case "api-clients": return screenApiClients();
    case "audit": return screenAudit();
    case "my-loans": return id ? screenMyLoanDetail(id) : screenMyLoans();
    default: return screenNotFound();
  }
}

function render() {
  document.documentElement.classList.toggle("dark", S.theme === "dark");
  const root = document.getElementById("root");
  const body = S.signedIn
    ? appFrame(renderRoute())
    : screenLogin();
  // Pad the page by the demo strip's height so it never covers product chrome.
  document.body.style.paddingBottom = S.demoBarOpen ? "2.75rem" : "0";
  root.innerHTML = body + (S.dialog ? S.dialog : "") + toastStack(S.toasts) + demoControls();
  document.title = S.signedIn ? "Bhawana Capital — Loan Management (UI demo)" : "Sign in — Bhawana Capital (UI demo)";
}

function go(hash) {
  if (location.hash === hash) { S.route = hash; render(); }
  else location.hash = hash;
}

window.addEventListener("hashchange", () => {
  const next = parseRoute();
  if (next !== S.route) {
    S.route = next;
    S.appTab = "overview";
    S.borrowerTab = "profile";
    S.breadcrumbLabel = null;
    S.foreclosureOpen = false;
  }
  render();
});

/* ---------- toasts ---------- */

function toast(message, tone = "info") {
  const t = { id: Math.random(), message, tone };
  S.toasts.push(t);
  render();
  setTimeout(() => {
    S.toasts = S.toasts.filter((x) => x !== t);
    render();
  }, 4200);
}

/* ---------- dialog helpers ---------- */

function closeDialog() { S.dialog = null; render(); }

function confirmDialog({ title, description, confirmLabel, confirmAct, confirmArg, tone = "default", reasonRequired, reasonLabel, body }) {
  S.dialog = dialog({
    title, description,
    body: (body || "") + (reasonRequired ? `<div class="flex flex-col gap-2">
      <label class="text-foreground text-sm font-medium">${esc(reasonLabel || "Reason")} <span class="text-danger">*</span></label>
      <textarea data-act="dialog-reason" rows="3" placeholder="State why — this is written to the audit trail."
        class="border-input bg-input/20 placeholder:text-muted-foreground rounded-control w-full border px-2 py-1.5 text-sm outline-none"></textarea>
      <p data-slot="reason-error" class="text-danger hidden text-xs">A reason is required for this action.</p>
    </div>` : ""),
    footer: button("Cancel", { variant: "outline", act: "dialog-close" })
      + button(confirmLabel, { variant: tone === "destructive" ? "destructive" : "default", act: confirmAct, arg: confirmArg, cls: reasonRequired ? "" : "" }),
  });
  S.dialogReasonRequired = Boolean(reasonRequired);
  render();
}

/* ---------- transitions ---------- */

const REASON_REQUIRED_TARGETS = new Set(["REJECTED", "DISBURSEMENT_RETRY", "INVALID", "FORECLOSED"]);

function applyTransition(appId, to, reason) {
  const app = appById(appId);
  const from = appStatus(app);
  S.statusOverrides[appId] = to;

  (S.extraEvents[appId] = S.extraEvents[appId] || []).push({
    id: `${appId}-evt-${Date.now()}`,
    action: "STATUS_TRANSITION",
    summary: `Status moved ${from} → ${to}${reason ? ` — ${reason}` : ""}`,
    occurredAt: new Date().toISOString(),
    actorUsername: DEMO_ACTORS[S.role].username,
    correlationId: `corr-${Math.floor(Math.random() * 9000000 + 1000000)}`,
  });

  if (to === "DISBURSED") {
    const d = DB.DISBURSEMENTS[appId];
    const ref = d ? d.attempts[0]?.tranRefNo : "BHW778000";
    toast(`Disbursement requested. Reference: ${ref}.`, "success");
  } else {
    toast(`Application moved to ${STATUS_META[to].label}.`, "success");
  }
}

/* ---------- event wiring ---------- */

function fieldValue(el) { return el.value; }

document.addEventListener("input", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el || !(el.matches("input, textarea, select"))) return;
  const act = el.dataset.act;
  const v = fieldValue(el);
  const f = S.filters;
  const setF = (key, prop) => { f[key][prop] = v; f[key].page = 0; };

  const map = {
    "apps-q": ["apps", "q"], "apps-lspLoanId": ["apps", "lspLoanId"], "apps-bhawLoanId": ["apps", "bhawLoanId"],
    "borrowers-q": ["borrowers", "q"], "alerts-q": ["alerts", "q"],
    "lsps-q": ["lsps", "q"], "products-q": ["products", "q"], "users-q": ["users", "q"],
    "clients-q": ["apiClients", "q"], "myloans-q": ["myLoans", "q"],
    "audit-loan": ["audit", "loanId"], "audit-correlation": ["audit", "correlationId"],
  };
  if (map[act]) {
    const [k, p] = map[act];
    setF(k, p);
    // Preserve focus + caret across the re-render, as a debounced React input would.
    const sel = el.selectionStart;
    render();
    const next = document.querySelector(`[data-act="${act}"]`);
    if (next) { next.focus(); try { next.setSelectionRange(sel, sel); } catch (_) {} }
    return;
  }
  if (act === "login-email") { S.loginEmail = v; return; }
  if (act === "login-password") { S.loginPassword = v; return; }
  if (act === "dialog-reason") { S.dialogReason = v; return; }
});

document.addEventListener("change", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el || !el.matches("select, input[type=date]")) return;
  const act = el.dataset.act;
  const v = el.value;
  const f = S.filters;
  const set = (k, p) => { f[k][p] = v; f[k].page = 0; render(); };

  switch (act) {
    case "apps-status": return set("apps", "status");
    case "apps-lspId": return set("apps", "lspId");
    case "apps-productId": return set("apps", "productId");
    case "apps-from": return set("apps", "from");
    case "apps-to": return set("apps", "to");
    case "apps-size": f.apps.pageSize = Number(v); f.apps.page = 0; return render();
    case "borrowers-size": f.borrowers.pageSize = Number(v); f.borrowers.page = 0; return render();
    case "alerts-severity": return set("alerts", "severity");
    case "alerts-subject": return set("alerts", "subjectType");
    case "alerts-size": f.alerts.pageSize = Number(v); f.alerts.page = 0; return render();
    case "reports-type": f.reports.type = v; f.reports.page = 0; return render();
    case "reports-lsp": return set("reports", "lspId");
    case "reports-from": return set("reports", "from");
    case "reports-to": return set("reports", "to");
    case "reports-size": f.reports.pageSize = Number(v); f.reports.page = 0; return render();
    case "lsps-status": return set("lsps", "status");
    case "lsps-size": f.lsps.pageSize = Number(v); f.lsps.page = 0; return render();
    case "products-status": return set("products", "status");
    case "products-size": f.products.pageSize = Number(v); f.products.page = 0; return render();
    case "users-role": return set("users", "role");
    case "users-status": return set("users", "status");
    case "users-lsp": return set("users", "lspId");
    case "users-size": f.users.pageSize = Number(v); f.users.page = 0; return render();
    case "clients-status": return set("apiClients", "status");
    case "clients-lsp": return set("apiClients", "lspId");
    case "clients-size": f.apiClients.pageSize = Number(v); f.apiClients.page = 0; return render();
    case "audit-stream": return set("audit", "stream");
    case "audit-actor": return set("audit", "actor");
    case "audit-from": return set("audit", "from");
    case "audit-to": return set("audit", "to");
    case "audit-size": f.audit.pageSize = Number(v); f.audit.page = 0; return render();
    case "myloans-status": return set("myLoans", "status");
    case "myloans-size": f.myLoans.pageSize = Number(v); f.myLoans.page = 0; return render();
    case "demo-role":
      S.role = v; S.filters = initialFilters();
      S.route = defaultLandingFor(v);
      location.hash = S.route;
      return render();
    case "demo-uistate": S.uiState = v; return render();
    case "demo-theme": S.theme = v; return render();
    default: return undefined;
  }
});

document.addEventListener("submit", (e) => {
  if (e.target.closest("[data-act='login-submit']")) { e.preventDefault(); doLogin(); }
});

function doLogin() {
  if (!S.loginEmail.trim() || !S.loginPassword.trim()) {
    S.loginError = "Enter both an email address and a password.";
    return render();
  }
  S.loginError = null;
  S.signedIn = true;
  if (S.loginRole) S.role = S.loginRole;
  S.route = defaultLandingFor(S.role);
  location.hash = S.route;
  render();
}

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && S.dialog) { closeDialog(); return; }
  const row = e.target.closest("tr[data-act]");
  if (row && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); row.click(); }
});

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  if (el.matches("input, select, textarea")) return;
  const act = el.dataset.act;
  const arg = el.dataset.arg;
  const f = S.filters;

  const clearAndRender = (k, props) => { props.forEach((p) => { f[k][p] = ""; }); f[k].page = 0; render(); };

  switch (act) {
    /* navigation */
    case "go": e.preventDefault(); return go(arg);
    case "open-app": return go(`#/loan-applications/${arg}`);
    case "open-borrower": return go(`#/borrowers/${arg}`);
    case "open-my-loan": return go(`#/my-loans/${arg}`);
    case "sign-out":
      S.signedIn = false;
      S.loginRole = S.role;
      S.loginEmail = DB.USERS.find((u) => u.role === S.role)?.email || "";
      S.loginPassword = "demo-password";
      S.loginError = null;
      return render();

    /* login */
    case "login-role": {
      S.loginRole = arg;
      S.loginEmail = DB.USERS.find((u) => u.role === arg)?.email || "";
      S.loginPassword = S.loginPassword || "demo-password";
      return render();
    }
    case "login-toggle-password": S.loginShowPassword = !S.loginShowPassword; return render();
    case "login-submit": e.preventDefault(); return doLogin();

    /* chrome */
    case "toggle-theme": S.theme = S.theme === "dark" ? "light" : "dark"; return render();
    case "density": S.density = arg; return render();
    case "user-menu": return toast(`Signed in as ${DEMO_ACTORS[S.role].username} (${ROLE_LABELS[S.role]}).`);
    case "noop-columns": return toast("Column visibility is available in the live app.");

    /* demo controls */
    case "demo-open": S.demoBarOpen = true; return render();
    case "demo-close": S.demoBarOpen = false; return render();
    case "demo-normal": S.uiState = "normal"; return render();
    case "demo-reset":
      Object.assign(S, {
        filters: initialFilters(), statusOverrides: {}, userStatusOverrides: {}, ackedAlerts: {},
        extraPayments: {}, extraEvents: {}, extraDocs: {}, extraReports: [],
        tempPassword: null, revealedSecret: null, uiState: "normal",
      });
      toast("Demo data reset.", "success");
      return render();

    /* filters — loan applications */
    case "apps-clear-q": f.apps.q = ""; f.apps.page = 0; return render();
    case "apps-clear-lspLoanId": f.apps.lspLoanId = ""; return render();
    case "apps-clear-bhawLoanId": f.apps.bhawLoanId = ""; return render();
    case "apps-clear-status": f.apps.status = ""; return render();
    case "apps-clear-lspId": f.apps.lspId = ""; return render();
    case "apps-clear-productId": f.apps.productId = ""; return render();

    /* audit */
    case "audit-detail": {
      const ev = DB.AUDIT.find((x) => x.id === arg);
      S.dialog = dialog({
        title: "Audit event", description: ev.summary, size: "max-w-2xl",
        body: `<dl class="grid grid-cols-1 gap-x-6 gap-y-3 sm:grid-cols-2">
            ${detailRow("Stream", esc(AUDIT_STREAM_META[ev.stream].label))}${detailRow("Action", mono(ev.action))}
            ${detailRow("Actor", esc(ev.actorUsername))}${detailRow("When", esc(formatDateTime(ev.occurredAt)))}
            ${detailRow("Subject", esc(ev.subjectLabel || "—"))}${detailRow("Correlation", mono(ev.correlationId))}
          </dl>
          <div class="flex flex-col gap-1.5"><span class="text-foreground text-sm font-medium">Payload</span>
          <pre class="bg-surface-muted rounded-container overflow-x-auto p-3 font-mono text-xs">${esc(JSON.stringify(ev.detail, null, 2))}</pre></div>`,
        footer: button("Close", { variant: "outline", act: "dialog-close" }),
      });
      return render();
    }

    /* reports */
    case "report-generate":
      S.dialog = dialog({
        title: "Generate report",
        description: "The report is queued and downloadable once it finishes.",
        body: `<div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
          <label class="flex flex-col gap-1.5"><span class="text-foreground text-sm font-medium">Report</span>
            <select data-act="reports-type" class="border-input bg-input/20 rounded-control h-8 w-full border px-2 text-sm outline-none">
              ${Object.entries(REPORT_TYPES).map(([v, m]) => `<option value="${v}"${v === S.filters.reports.type ? " selected" : ""}>${m.label}</option>`).join("")}</select></label>
          <label class="flex flex-col gap-1.5"><span class="text-foreground text-sm font-medium">LSP</span>
            <select class="border-input bg-input/20 rounded-control h-8 w-full border px-2 text-sm outline-none">
              <option value="">All LSPs</option>${DB.LSPS.map((l) => `<option value="${l.id}">${l.name}</option>`).join("")}</select></label>
          <label class="flex flex-col gap-1.5"><span class="text-foreground text-sm font-medium">Format</span>
            <select class="border-input bg-input/20 rounded-control h-8 w-full border px-2 text-sm outline-none"><option>CSV</option><option>XLSX</option></select></label>
          <label class="flex flex-col gap-1.5"><span class="text-foreground text-sm font-medium">Disbursed from</span>
            <input type="date" value="2026-07-01" class="border-input bg-input/20 rounded-control h-8 w-full border px-2 text-sm outline-none" /></label>
          <label class="flex flex-col gap-1.5"><span class="text-foreground text-sm font-medium">Disbursed to</span>
            <input type="date" value="2026-08-31" class="border-input bg-input/20 rounded-control h-8 w-full border px-2 text-sm outline-none" /></label>
        </div>`,
        footer: button("Cancel", { variant: "outline", act: "dialog-close" }) + button("Queue report", { act: "report-queue" }),
      });
      return render();
    case "report-queue":
      S.extraReports.unshift({
        id: `demo-report-${Date.now()}`, reportType: S.filters.reports.type || "PORTFOLIO_MIS",
        status: "QUEUED", from: "2026-07-01", to: "2026-08-31",
        lspName: null, requestedBy: DEMO_ACTORS[S.role].username, createdAt: new Date().toISOString(),
        completedAt: null, rowCount: null, fileName: null, errorMessage: null,
      });
      S.dialog = null;
      toast("Report queued. It will appear as Completed when it finishes.", "success");
      render();
      setTimeout(() => {
        const r = S.extraReports[0];
        if (r) { r.status = "COMPLETED"; r.rowCount = 1284; r.completedAt = new Date().toISOString(); r.fileName = "portfolio-mis-demo.csv"; }
        render();
      }, 3200);
      return undefined;
    case "report-download": return toast("The CSV downloads in the live app; every download is audited.");

    /* generic */
    case "generic-success":
      S.dialog = null;
      toast(arg || "Done.", "success");
      return render();
    case "noop": return undefined;
    default: return undefined;
  }
});

function transitionLabel(from, to) {
  const t = TRANSITIONS.find((x) => x.from === from && x.to === to);
  return t ? t.label : "Confirm";
}

function disbursementPreview(app) {
  const d = DB.DISBURSEMENTS[app.id];
  if (!d) return "";
  return `<div class="bg-card-muted rounded-container flex flex-col gap-3 p-4">
    <p class="text-foreground text-sm font-semibold">Verify before you disburse</p>
    <dl class="grid grid-cols-1 gap-x-6 gap-y-3 sm:grid-cols-2">
      ${detailRow("Principal", formatINR(d.principal, { decimals: 2 }))}
      ${detailRow("Processing fee", formatINR(d.processingFee, { decimals: 2 }))}
      ${detailRow("Net disbursal amount", `<span class="font-semibold">${formatINR(d.netDisbursalAmount, { decimals: 2 })}</span>`)}
      ${detailRow("Payment mode", esc(d.paymentMode))}
      ${detailRow("Beneficiary", esc(d.beneficiaryAccountHolderName))}
      ${detailRow("Bank", esc(d.beneficiaryBankName))}
      ${detailRow("Account", `<span class="font-mono">${esc(d.maskedBeneficiaryAccountNumber)}</span>`)}
      ${detailRow("IFSC", mono(d.beneficiaryIfsc))}
    </dl>
    <p class="text-foreground-muted text-xs">Source: ${esc(d.beneficiarySource)}. Once requested, the payout is in flight and cannot be recalled from this screen.</p>
  </div>`;
}

/* ---------- boot ---------- */

S.route = parseRoute();
if (!location.hash) location.hash = "#/home";
render();

</script>
</body>
</html>
